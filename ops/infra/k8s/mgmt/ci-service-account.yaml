# ServiceAccount used by GitHub Actions to deploy the Glossia Helm charts
# into a workload cluster. Its long-lived token is rendered into a
# kubeconfig and stored as the KUBECONFIG GitHub Environment secret.
#
# RBAC is cluster-admin. Narrowing it is busywork: anything the chart
# installs that grants cluster-wide rbac/apps creation requires
# matching permissions or `escalate`/`bind`, which together is
# functionally cluster-admin anyway.
#
# Applied per-environment by substituting __NAMESPACE__ with the target
# namespace (e.g. glossia-production) and piping into kubectl. Example:
#
#   sed 's/__NAMESPACE__/glossia-production/g' infra/k8s/mgmt/ci-service-account.yaml \
#     | kubectl --kubeconfig ~/.kube/glossia-production.yaml apply -f -
#
# The placeholder exists because Kubernetes has no built-in "inherit the
# namespace from an outer scope" primitive — each resource's metadata
# (and every ClusterRoleBinding subject) must name it explicitly.

apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-deployer
  namespace: __NAMESPACE__
---
# Long-lived token kubelet-style. The SA controller no longer auto-creates
# token Secrets in k8s ≥1.24, so we create one explicitly.
apiVersion: v1
kind: Secret
metadata:
  name: github-actions-deployer-token
  namespace: __NAMESPACE__
  annotations:
    kubernetes.io/service-account.name: github-actions-deployer
type: kubernetes.io/service-account-token
---
# Cluster-admin binding. See header comment for the rationale.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-actions-deployer-cluster
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: github-actions-deployer
    namespace: __NAMESPACE__
