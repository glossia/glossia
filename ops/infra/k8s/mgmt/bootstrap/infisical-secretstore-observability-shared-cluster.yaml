# Additional observability secret store for the shared production cluster.
#
# Create `infisical-observability-universal-auth` in the `infisical` namespace
# before applying this manifest. Keeping a separate store preserves the
# existing read-only machine identity and project boundary even though the
# workloads now share a Kubernetes cluster.

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-observability
spec:
  provider:
    infisical:
      hostAPI: https://eu.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-observability-universal-auth
            namespace: infisical
            key: clientId
          clientSecret:
            name: infisical-observability-universal-auth
            namespace: infisical
            key: clientSecret
      secretsScope:
        projectSlug: glossia-observability
        environmentSlug: prod
