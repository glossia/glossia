apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "discourse.name" . }}-shared
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  storageClassName: {{ required "persistence.storageClass is required" .Values.persistence.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
