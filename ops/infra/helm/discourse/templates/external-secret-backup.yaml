{{- if and .Values.externalSecrets.enabled .Values.backups.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.backups.secretName }}
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.backups.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: {{ printf "{{ .%s }}" .Values.backups.externalSecret.accessKeyIdField | quote }}
        SECRET_ACCESS_KEY: {{ printf "{{ .%s }}" .Values.backups.externalSecret.secretAccessKeyField | quote }}
        REGION: {{ required "backups.s3.region is required when backups are enabled" .Values.backups.s3.region | quote }}
  data:
    - secretKey: {{ .Values.backups.externalSecret.accessKeyIdField }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.backups.externalSecret.itemKey .Values.backups.externalSecret.accessKeyIdField | quote }}
    - secretKey: {{ .Values.backups.externalSecret.secretAccessKeyField }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.backups.externalSecret.itemKey .Values.backups.externalSecret.secretAccessKeyField | quote }}
{{- end }}
