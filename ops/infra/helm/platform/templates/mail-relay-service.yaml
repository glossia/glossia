{{- if .Values.mailRelay.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.mailRelay.fullnameOverride }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mail-relay
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  type: {{ .Values.mailRelay.service.type }}
  selector:
    app.kubernetes.io/name: mail-relay
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: submission
      port: {{ .Values.mailRelay.service.port }}
      targetPort: submission
      protocol: TCP
{{- end }}
