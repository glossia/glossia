{{- if .Values.externalSecrets.enabled }}
# Basic-auth credentials for the public push endpoints (mimir/loki/tempo).
# Format: a single key `auth` whose value is an htpasswd file (one line
# per workload-cluster token):
#
#     glossia-production:$2y$10$<bcrypt-hash>
#     glossia-staging:$2y$10$<bcrypt-hash>
#
# Maintain the htpasswd content in Infisical directly. External Secrets Operator has no
# bcrypt template function, so we cannot derive it at render time from
# plain tokens. The plain tokens themselves live in the workload
# production folder (for example, `push-token-glossia-production`), shipped to that cluster's Alloy
# install via its own ExternalSecret.
#
# To rotate a token: `htpasswd -B -n <user>` locally, replace the
# matching line in Infisical, update the matching plain token
# in the workload-cluster's vault, and let ESO's refreshInterval pick
# up both within the hour.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.pushAuth.secretName }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.externalSecrets.pushAuth.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # nginx ingress basic-auth expects the htpasswd file in the
        # `auth` key.
        auth: {{ printf "{{ .%s }}" .Values.externalSecrets.pushAuth.htpasswdField | quote }}
  data:
    - secretKey: {{ .Values.externalSecrets.pushAuth.htpasswdField }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.pushAuth.itemKey .Values.externalSecrets.pushAuth.htpasswdField | quote }}
{{- end }}
