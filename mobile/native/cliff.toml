# Independent iOS releases, following Habibi's conventional-commit policy.
[bump]
initial_tag = "ios@0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = true

[changelog]
header = "# Changelog\n\n"
body = """
## {{ version | default(value="Unreleased") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
* {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}
{% if previous.version %}
**Full changelog**: https://github.com/glossia/glossia/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true
postprocessors = [
  { pattern = '\* (feat|fix|docs?|perf|refactor|style|test)(\([^)]*\))?!?:\s*', replace = "* " },
]

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
split_commits = false
protect_breaking_commits = true
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = "([#${1}](https://github.com/glossia/glossia/pull/${1}))" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs?", group = "<!-- 4 -->Documentation" },
  { message = "^style", group = "<!-- 5 -->Styling" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^(chore|ci|build)", skip = true },
]
tag_pattern = '^ios@[0-9]+\.[0-9]+\.[0-9]+$'
sort_commits = "newest"
