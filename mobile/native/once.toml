[workspace]
include = ["once.toml"]
exclude = ["**/Cargo.toml"]

[modules]
paths = ["modules/*.star"]

[infrastructure.cache]
provider = "local"

[[target]]
name = "GlossiaDependencies"
kind = "cargo_dependencies"
[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "core/Cargo.toml"]

[[target]]
name = "GlossiaAndroidDependencies"
kind = "cargo_dependencies"
[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
target = "aarch64-linux-android"
build_script_tools = ["aarch64-linux-android-clang", "clang", "llvm-ar"]
resolver_inputs = ["Cargo.toml", "Cargo.lock", "core/Cargo.toml"]

[[target]]
name = "GlossiaIOSDependencies"
kind = "cargo_dependencies"
[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
target = "aarch64-apple-ios-sim"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "core/Cargo.toml"]

[[target]]
name = "GlossiaDeviceDependencies"
kind = "cargo_dependencies"
[target.attrs]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
vendor_dir = ".once/vendor"
target = "aarch64-apple-ios"
resolver_inputs = ["Cargo.toml", "Cargo.lock", "core/Cargo.toml"]

[[target]]
name = "GlossiaCoreTests"
kind = "rust_test"
srcs = ["core/src/**/*.rs"]
deps = ["./GlossiaDependencies"]
[target.attrs]
crate_name = "glossia_core"
crate_root = "core/src/lib.rs"
cargo_package = "glossia-core"
edition = "2024"
rustc_flags = ["-Dwarnings"]

[[target]]
name = "GlossiaCoreAndroid"
kind = "rust_library"
srcs = ["core/src/**/*.rs"]
deps = ["./GlossiaAndroidDependencies"]
[target.attrs]
crate_name = "glossia_core"
crate_root = "core/src/lib.rs"
cargo_package = "glossia-core"
edition = "2024"
target = "aarch64-linux-android"
crate_type = "cdylib"
android_abi = "arm64-v8a"
android_api = 26
linker_flags = ["-Wl,-z,max-page-size=16384", "-Wl,-z,common-page-size=16384"]

[[target]]
name = "GlossiaCoreIOS"
kind = "rust_library"
srcs = ["core/src/**/*.rs"]
deps = ["./GlossiaIOSDependencies"]
[target.attrs]
crate_name = "glossia_core"
crate_root = "core/src/lib.rs"
cargo_package = "glossia-core"
edition = "2024"
target = "aarch64-apple-ios-sim"
crate_type = "staticlib"

[[target]]
name = "GlossiaCoreDevice"
kind = "rust_library"
srcs = ["core/src/**/*.rs"]
deps = ["./GlossiaDeviceDependencies"]
[target.attrs]
crate_name = "glossia_core"
crate_root = "core/src/lib.rs"
cargo_package = "glossia-core"
edition = "2024"
target = "aarch64-apple-ios"
crate_type = "staticlib"

[[target]]
name = "GlossiaCoreFFI"
kind = "apple_system_module"
[target.attrs]
modulemap = "core/include/module.modulemap"
headers = ["core/include/glossia_core.h"]
header_dirs = ["core/include"]

[[target]]
name = "GlossiaAndroid"
kind = "glossia_android_application"
srcs = ["android/src/**/*.kt", "android/res/**/*", "android/AndroidManifest.xml", "android/*.gradle.kts", "android/gradle.properties", "android/gradle.lockfile"]
deps = ["./GlossiaCoreAndroid"]

[[target]]
name = "GlossiaSimulatorSDK"
kind = "glossia_apple_sdk"
[target.attrs]
sdk = "iphonesimulator"

[[target]]
name = "GlossiaDeviceSDK"
kind = "glossia_apple_sdk"
[target.attrs]
sdk = "iphoneos"

[[target]]
name = "GlossiaIOS"
kind = "apple_application"
srcs = ["ios/Sources/**/*.swift"]
deps = ["./GlossiaCoreIOS", "./GlossiaCoreFFI", "./GlossiaSimulatorSDK", "./GlossiaActivity"]
[target.attrs]
platform = "ios"
sdk_frameworks = ["AuthenticationServices", "Security", "ActivityKit", "Speech", "AVFoundation"]
bundle_id = "ai.glossia.mobile"
product_name = "Glossia"
asset_catalogs = ["ios/Resources/Assets.xcassets"]
app_icon = "AppIcon"
resources = ["android/res/raw/third_party_notices.txt", "ios/Resources/*.lproj/*.strings"]
minimum_os = "17.0"
sdk_variant = "simulator"
families = ["iphone", "ipad"]
info_plist = "ios/Info.plist"
entitlements = "ios/Simulator.entitlements"
postbuild_actions = ['{"name":"Embed Glossia Activity","cacheable":true,"inputs":[".once/out/GlossiaActivity/GlossiaActivity.appex"],"outputs":[".once/out/GlossiaIOS/Glossia.app/PlugIns/GlossiaActivity.appex"],"argv":["/usr/bin/ditto",".once/out/GlossiaActivity/GlossiaActivity.appex",".once/out/GlossiaIOS/Glossia.app/PlugIns/GlossiaActivity.appex"]}']

[[target]]
name = "GlossiaIOSDevice"
kind = "apple_application"
srcs = ["ios/Sources/**/*.swift"]
deps = ["./GlossiaCoreDevice", "./GlossiaCoreFFI", "./GlossiaDeviceSDK", "./GlossiaActivityDevice"]
[target.attrs]
platform = "ios"
sdk_frameworks = ["AuthenticationServices", "Security", "ActivityKit", "Speech", "AVFoundation"]
bundle_id = "ai.glossia.mobile"
product_name = "Glossia"
asset_catalogs = ["ios/Resources/Assets.xcassets"]
app_icon = "AppIcon"
resources = ["android/res/raw/third_party_notices.txt", "ios/Resources/*.lproj/*.strings"]
minimum_os = "17.0"
sdk_variant = "device"
families = ["iphone", "ipad"]
info_plist = "ios/Info.plist"
postbuild_actions = ['{"name":"Embed Glossia Activity","cacheable":true,"inputs":[".once/out/GlossiaActivityDevice/GlossiaActivity.appex"],"outputs":[".once/out/GlossiaIOSDevice/Glossia.app/PlugIns/GlossiaActivity.appex"],"argv":["/usr/bin/ditto",".once/out/GlossiaActivityDevice/GlossiaActivity.appex",".once/out/GlossiaIOSDevice/Glossia.app/PlugIns/GlossiaActivity.appex"]}']

[[target]]
name = "GlossiaIOSPreview"
kind = "apple_application"
srcs = ["ios/Previews/**/*.swift", "ios/Sources/GlossiaLoginView.swift", "ios/Sources/GlossiaSession.swift", "ios/Sources/GlossiaLanguage.swift", "ios/Sources/GlossiaPushNotifications.swift", "ios/Sources/GlossiaNavigation.swift", "ios/Sources/GlossiaBrand.swift", "ios/Sources/GlossiaAppearance.swift", "ios/Sources/GlossiaWorkspaceView.swift", "ios/Sources/WorkspacePicker.swift", "ios/Sources/TokiView.swift", "ios/Sources/TokiGoalView.swift", "ios/Sources/TokiComposer.swift", "ios/Sources/TokiVoiceInput.swift", "ios/Sources/FluentLanguages.swift", "ios/Sources/TokiSprite.swift", "ios/Sources/TokiActivityAttributes.swift", "ios/Sources/TokiLiveActivities.swift", "ios/Sources/TokiWorkController.swift", "ios/Sources/TokiWorkStatusView.swift", "ios/Sources/TranslationsView.swift", "ios/Sources/AnalyticsView.swift", "ios/Sources/ProfileView.swift"]
deps = ["./GlossiaCoreIOS", "./GlossiaCoreFFI", "./GlossiaSimulatorSDK", "./GlossiaActivityPreview"]
[target.attrs]
platform = "ios"
sdk_frameworks = ["AuthenticationServices", "Security", "ActivityKit", "Speech", "AVFoundation"]
bundle_id = "ai.glossia.mobile.preview"
product_name = "GlossiaPreview"
asset_catalogs = ["ios/Resources/Assets.xcassets"]
resources = ["ios/Resources/*.lproj/*.strings"]
minimum_os = "17.0"
sdk_variant = "simulator"
families = ["iphone", "ipad"]
info_plist = "ios/Previews/Info.plist"
postbuild_actions = ['{"name":"Embed Glossia Activity","cacheable":true,"inputs":[".once/out/GlossiaActivityPreview/GlossiaActivity.appex"],"outputs":[".once/out/GlossiaIOSPreview/GlossiaPreview.app/PlugIns/GlossiaActivity.appex"],"argv":["/usr/bin/ditto",".once/out/GlossiaActivityPreview/GlossiaActivity.appex",".once/out/GlossiaIOSPreview/GlossiaPreview.app/PlugIns/GlossiaActivity.appex"]}']

[[target]]
name = "GlossiaIOSTests"
kind = "apple_test_bundle"
srcs = ["ios/Tests/**/*.swift", "ios/Sources/GlossiaSession.swift", "ios/Sources/GlossiaLanguage.swift", "ios/Sources/GlossiaPushNotifications.swift", "ios/Sources/GlossiaNavigation.swift", "ios/Sources/GlossiaBrand.swift", "ios/Sources/GlossiaAppearance.swift", "ios/Sources/TokiView.swift", "ios/Sources/TokiGoalView.swift", "ios/Sources/TokiComposer.swift", "ios/Sources/TokiVoiceInput.swift", "ios/Sources/FluentLanguages.swift", "ios/Sources/TokiSprite.swift", "ios/Sources/TokiActivityAttributes.swift", "ios/Sources/TokiLiveActivities.swift", "ios/Sources/TokiWorkController.swift", "ios/Sources/TokiWorkStatusView.swift", "ios/Sources/TranslationsView.swift", "ios/Sources/AnalyticsView.swift"]
deps = ["./GlossiaCoreIOS", "./GlossiaCoreFFI", "./GlossiaSimulatorSDK"]
[target.attrs]
platform = "ios"
minimum_os = "17.0"
sdk_variant = "simulator"
bundle_id = "ai.glossia.mobile.tests"
sdk_frameworks = ["AuthenticationServices", "Security", "ActivityKit", "Speech", "AVFoundation"]
# Once 0.68.2 hashes test resource inputs literally, without expanding globs.
# Application targets above still package every translated .lproj catalog.
resources = ["ios/Resources/en.lproj/Localizable.strings"]
swift_testing = true

[[target]]
name = "GlossiaIOSUITests"
kind = "apple_test_bundle"
srcs = ["ios/UITests/**/*.swift"]
deps = ["./GlossiaIOSPreview"]
[target.attrs]
platform = "ios"
minimum_os = "17.0"
sdk_variant = "simulator"
bundle_id = "ai.glossia.mobile.uitests"
ui_testing = true

[[target]]
name = "GlossiaActivityExecutable"
kind = "apple_application"
srcs = ["ios/LiveActivity/*.swift", "ios/Sources/TokiActivityAttributes.swift"]
deps = ["./GlossiaSimulatorSDK"]
[target.attrs]
platform = "ios"
bundle_id = "ai.glossia.mobile.activity"
product_name = "GlossiaActivity"
application_extension = true
minimum_os = "17.0"
sdk_variant = "simulator"
families = ["iphone", "ipad"]
sdk_frameworks = ["WidgetKit", "SwiftUI", "ActivityKit"]
resources = ["ios/Resources/Assets.xcassets/TokiFocused.imageset/TokiFocused.png", "ios/Resources/*.lproj/*.strings"]
info_plist = "ios/LiveActivity/Info.plist"
info_plist_substitutions = { EXTENSION_BUNDLE_ID = "ai.glossia.mobile.activity" }

[[target]]
name = "GlossiaActivity"
kind = "glossia_widget_extension"
deps = ["./GlossiaActivityExecutable"]

[[target]]
name = "GlossiaActivityDeviceExecutable"
kind = "apple_application"
srcs = ["ios/LiveActivity/*.swift", "ios/Sources/TokiActivityAttributes.swift"]
deps = ["./GlossiaDeviceSDK"]
[target.attrs]
platform = "ios"
bundle_id = "ai.glossia.mobile.activity"
product_name = "GlossiaActivity"
application_extension = true
minimum_os = "17.0"
sdk_variant = "device"
families = ["iphone", "ipad"]
sdk_frameworks = ["WidgetKit", "SwiftUI", "ActivityKit"]
resources = ["ios/Resources/Assets.xcassets/TokiFocused.imageset/TokiFocused.png", "ios/Resources/*.lproj/*.strings"]
info_plist = "ios/LiveActivity/Info.plist"
info_plist_substitutions = { EXTENSION_BUNDLE_ID = "ai.glossia.mobile.activity" }

[[target]]
name = "GlossiaActivityDevice"
kind = "glossia_widget_extension"
deps = ["./GlossiaActivityDeviceExecutable"]

[[target]]
name = "GlossiaActivityPreviewExecutable"
kind = "apple_application"
srcs = ["ios/LiveActivity/*.swift", "ios/Sources/TokiActivityAttributes.swift"]
deps = ["./GlossiaSimulatorSDK"]
[target.attrs]
platform = "ios"
bundle_id = "ai.glossia.mobile.preview.activity"
product_name = "GlossiaActivity"
application_extension = true
minimum_os = "17.0"
sdk_variant = "simulator"
families = ["iphone", "ipad"]
sdk_frameworks = ["WidgetKit", "SwiftUI", "ActivityKit"]
resources = ["ios/Resources/Assets.xcassets/TokiFocused.imageset/TokiFocused.png", "ios/Resources/*.lproj/*.strings"]
info_plist = "ios/LiveActivity/Info.plist"
info_plist_substitutions = { EXTENSION_BUNDLE_ID = "ai.glossia.mobile.preview.activity" }

[[target]]
name = "GlossiaActivityPreview"
kind = "glossia_widget_extension"
deps = ["./GlossiaActivityPreviewExecutable"]
