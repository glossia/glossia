name: Bug report
description: Report a reproducible problem in Glossia.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include credentials, private repositories, or customer content. Security issues belong in a private security advisory."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glossia version or commit
