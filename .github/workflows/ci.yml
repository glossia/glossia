name: CLI

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "mise/**"
      - "mise.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cli/**"
      - "mise/**"
      - "mise.toml"
      - ".github/workflows/ci.yml"

jobs:
  format:
    if: github.event.pull_request.draft != true
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Format check
        run: cargo fmt -- --check

  clippy:
    if: github.event.pull_request.draft != true
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    if: github.event.pull_request.draft != true
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
      - name: Test library
        run: cargo test --lib
      - name: Test end-to-end translation
        run: cargo test --test e2e_translate

  build:
    if: github.event.pull_request.draft != true
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
      - name: Build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release --bin glossia
