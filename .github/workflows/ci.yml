name: CLI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "mise/**"
      - "mise.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "cli/**"
      - "mise/**"
      - "mise.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

# Fork pull requests never need access to the Hetzner runner cluster.
jobs:
  format:
    if: github.event.pull_request.draft != true
    name: Format
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'hetzner-docker' }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          cache: true
          install_args: rust
      - name: Format check
        run: cargo fmt -- --check

  clippy:
    if: github.event.pull_request.draft != true
    name: Clippy
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'hetzner-docker' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          cache: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    if: github.event.pull_request.draft != true
    name: Test
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'hetzner-docker' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          cache: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
      - name: Test library
        run: cargo test --lib

  build:
    if: github.event.pull_request.draft != true
    name: Build
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'hetzner-docker' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          cache: true
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
      - name: Build
        env:
          RUSTFLAGS: -D warnings
        run: cargo build --release --bin glossia
