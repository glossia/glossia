name: Infra

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/**"
      - "deploy/values-*.yaml"
      - "infra/helm/**"
      - "infra/k8s/**"
      - "infra/tailscale/**"
      - ".github/workflows/infra.yml"
      - "mise/**"
      - "mise.toml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "deploy/helm/**"
      - "deploy/values-*.yaml"
      - "infra/helm/**"
      - "infra/k8s/**"
      - "infra/tailscale/**"
      - ".github/workflows/infra.yml"
      - "mise/**"
      - "mise.toml"

permissions:
  contents: read

jobs:
  helm:
    if: github.event.pull_request.draft != true
    name: Helm Charts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install tools
        run: mise install

      - name: Validate Tailscale policy
        run: |
          ruby <<'RUBY'
          require "json"

          file = "infra/tailscale/policy.hujson"
          input = File.read(file)
          output = +""
          in_string = false
          escaped = false
          index = 0

          while index < input.length
            character = input[index]
            following = input[index + 1]

            if !in_string && character == "/" && following == "/"
              index += 1 while index < input.length && input[index] != "\n"
              output << "\n"
              next
            end

            output << character

            if in_string
              if escaped
                escaped = false
              elsif character == "\\"
                escaped = true
              elsif character == '"'
                in_string = false
              end
            elsif character == '"'
              in_string = true
            end

            index += 1
          end

          JSON.parse(output.gsub(/,\s*([}\]])/, '\1'))
          RUBY

      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail

          mise exec -- kubectl kustomize infra/k8s/clusters/workloads/production >/tmp/glossia-production-cluster.yaml
          mise exec -- kubectl kustomize infra/k8s/clusters/workloads/observability >/tmp/glossia-observability-cluster.yaml
          mise exec -- kubectl kustomize infra/k8s/mgmt/flux/flux-system >/tmp/glossia-flux-system.yaml

          ruby <<'RUBY'
          require "yaml"

          Dir["infra/k8s/mgmt/flux/**/*.yaml"].sort.each do |file|
            YAML.parse_stream(File.read(file))
          end
          RUBY

          mise exec flux2@2.9.1 -- flux build kustomization flux-system \
            --path ./infra/k8s/mgmt/flux \
            --kustomization-file ./infra/k8s/mgmt/flux/flux-system/gotk-sync.yaml \
            --dry-run >/tmp/flux-system-build.yaml

          mise exec flux2@2.9.1 -- flux build kustomization workload-cluster-production \
            --path ./infra/k8s/clusters/workloads/production \
            --kustomization-file ./infra/k8s/mgmt/flux/workload-clusters.yaml \
            --dry-run >/tmp/flux-production-build.yaml

          mise exec flux2@2.9.1 -- flux build kustomization workload-cluster-observability \
            --path ./infra/k8s/clusters/workloads/observability \
            --kustomization-file ./infra/k8s/mgmt/flux/workload-clusters.yaml \
            --dry-run >/tmp/flux-observability-build.yaml

      - name: Add Helm repositories
        run: |
          mise exec -- helm repo add jetstack https://charts.jetstack.io
          mise exec -- helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          mise exec -- helm repo add external-dns https://kubernetes-sigs.github.io/external-dns
          mise exec -- helm repo add external-secrets https://charts.external-secrets.io
          mise exec -- helm repo add cnpg https://cloudnative-pg.github.io/charts
          mise exec -- helm repo add rook-release https://charts.rook.io/release
          mise exec -- helm repo add grafana https://grafana.github.io/helm-charts
          mise exec -- helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          mise exec -- helm repo update

      - name: Validate Helm charts
        run: |
          set -euo pipefail

          validate_chart() {
            local release="$1"
            local chart="$2"
            local namespace="$3"
            shift 3

            mise exec -- helm dependency build "$chart"
            mise exec -- helm lint "$chart" "$@"
            mise exec -- helm template "$release" "$chart" \
              --namespace "$namespace" \
              "$@" >/tmp/"$release"-rendered.yaml
          }

          validate_chart platform infra/helm/platform platform \
            --values infra/helm/platform/values-hetzner.yaml

          validate_chart platform-observability infra/helm/platform platform \
            --values infra/helm/platform/values-hetzner.yaml \
            --values infra/helm/platform/values-observability.yaml

          validate_chart observability infra/helm/observability observability \
            --values infra/helm/observability/values-hetzner.yaml

          validate_chart glossia deploy/helm/glossia glossia \
            --values deploy/values-production.yaml

          validate_chart alloy deploy/helm/glossia-alloy observability \
            --values deploy/values-alloy-production.yaml

          validate_chart tailscale-apiserver-proxy-production infra/helm/tailscale-apiserver-proxy tailscale \
            --values infra/helm/tailscale-apiserver-proxy/values-production.yaml

          validate_chart tailscale-apiserver-proxy-observability infra/helm/tailscale-apiserver-proxy tailscale \
            --values infra/helm/tailscale-apiserver-proxy/values-observability.yaml

  glossia-e2e:
    if: github.event.pull_request.draft != true
    name: Glossia End-to-End
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: helm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install tools
        run: mise install

      - name: Run Glossia end-to-end tests
        run: mise exec kind@0.32.0 shellspec@0.28.1 -- bash deploy/helm/glossia/e2e/kind.sh

  reconcile-management:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Reconcile management cluster
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    needs: [helm, glossia-e2e]
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: reconcile-management-cluster
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: kubectl

      - name: Load management kubeconfig from Infisical
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          identity-id: 5e5341af-be58-4839-a665-5d6355930102
          project-slug: glossia
          env-slug: prod
          secret-path: /kubeconfig-glossia-mgmt
          domain: https://eu.infisical.com

      - name: Write management kubeconfig
        run: |
          set -euo pipefail
          umask 077

          kubeconfig="$RUNNER_TEMP/management-kubeconfig"
          test -n "${CONTENT:-}"
          printf '%s' "$CONTENT" > "$kubeconfig"
          test -s "$kubeconfig"

          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          echo "CONTENT=" >> "$GITHUB_ENV"

      - name: Verify management cluster reachability
        run: mise exec -- kubectl --request-timeout=10s get --raw /version >/dev/null

      - name: Load Flux source credentials from Infisical
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          identity-id: 5e5341af-be58-4839-a665-5d6355930102
          project-slug: glossia
          env-slug: prod
          secret-path: /flux-system
          domain: https://eu.infisical.com

      - name: Restore Flux source credentials
        run: |
          set -euo pipefail
          umask 077

          auth_dir="$RUNNER_TEMP/flux-auth"
          mkdir -p "$auth_dir"

          test -n "${GITHUB_APP_ID:-}"
          test -n "${GITHUB_APP_INSTALLATION_OWNER:-}"
          test -n "${GITHUB_APP_PRIVATE_KEY:-}"
          printf '%s\n' "$GITHUB_APP_PRIVATE_KEY" > "$auth_dir/github-app-private-key"

          mise exec -- kubectl -n flux-system create secret generic flux-system \
            --from-literal=githubAppID="$GITHUB_APP_ID" \
            --from-literal=githubAppInstallationOwner="$GITHUB_APP_INSTALLATION_OWNER" \
            --from-file=githubAppPrivateKey="$auth_dir/github-app-private-key" \
            --dry-run=client -o yaml \
            | mise exec -- kubectl apply -f -

          rm -rf "$auth_dir"
          echo "GITHUB_APP_ID=" >> "$GITHUB_ENV"
          echo "GITHUB_APP_INSTALLATION_OWNER=" >> "$GITHUB_ENV"
          echo "GITHUB_APP_PRIVATE_KEY=" >> "$GITHUB_ENV"

      - name: Reconcile Flux configuration
        run: |
          set -euo pipefail

          mise exec -- kubectl apply \
            -f infra/k8s/mgmt/flux/flux-system/gotk-sync.yaml \
            -f infra/k8s/mgmt/flux/workload-cluster-rbac.yaml \
            -f infra/k8s/mgmt/flux/workload-clusters.yaml

          requested_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mise exec -- kubectl -n flux-system annotate --overwrite \
            gitrepository.source.toolkit.fluxcd.io/flux-system \
            "reconcile.fluxcd.io/requestedAt=$requested_at"
          mise exec -- kubectl -n flux-system wait \
            --for=condition=Ready gitrepository.source.toolkit.fluxcd.io/flux-system \
            --timeout=2m

          mise exec -- kubectl -n flux-system annotate --overwrite \
            kustomization.kustomize.toolkit.fluxcd.io/flux-system \
            "reconcile.fluxcd.io/requestedAt=$requested_at"
          mise exec -- kubectl -n flux-system wait \
            --for=condition=Ready kustomization.kustomize.toolkit.fluxcd.io/flux-system \
            --timeout=5m

  reconcile-observability:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Reconcile observability cluster
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    needs: [helm, glossia-e2e]
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: reconcile-observability-cluster
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: helm kubectl

      - name: Load Tailscale credentials from Infisical
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          identity-id: 5e5341af-be58-4839-a665-5d6355930102
          project-slug: glossia
          env-slug: prod
          secret-path: /tailscale-github-actions-authkey
          domain: https://eu.infisical.com

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ env.AUTHKEY }}
          ping: glossia-observability-kube.tail96f99b.ts.net

      - name: Load management kubeconfig from Infisical
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          identity-id: 5e5341af-be58-4839-a665-5d6355930102
          project-slug: glossia
          env-slug: prod
          secret-path: /kubeconfig-glossia-mgmt
          domain: https://eu.infisical.com

      - name: Write workload kubeconfig
        run: |
          set -euo pipefail
          umask 077

          management_kubeconfig="$RUNNER_TEMP/management-kubeconfig"
          workload_kubeconfig="$RUNNER_TEMP/observability-kubeconfig"

          test -n "${CONTENT:-}"
          printf '%s' "$CONTENT" > "$management_kubeconfig"
          test -s "$management_kubeconfig"

          KUBECONFIG="$management_kubeconfig" mise exec -- kubectl \
            --request-timeout=10s \
            -n org-glossia get secret glossia-observability-kubeconfig \
            -o jsonpath='{.data.value}' \
            | base64 --decode > "$workload_kubeconfig"
          test -s "$workload_kubeconfig"

          cluster_name="$(KUBECONFIG="$workload_kubeconfig" mise exec -- kubectl \
            config view --minify -o jsonpath='{.clusters[0].name}')"
          KUBECONFIG="$workload_kubeconfig" mise exec -- kubectl config set-cluster "$cluster_name" \
            --server=https://glossia-observability-kube.tail96f99b.ts.net \
            --tls-server-name=kubernetes

          echo "KUBECONFIG=$workload_kubeconfig" >> "$GITHUB_ENV"
          echo "CONTENT=" >> "$GITHUB_ENV"

      - name: Verify observability cluster reachability
        run: mise exec -- kubectl --request-timeout=10s get --raw /version >/dev/null

      - name: Deploy observability services
        run: |
          set -euo pipefail

          mise exec -- helm dependency update infra/helm/platform
          mise exec -- helm upgrade --install platform infra/helm/platform \
            --namespace platform \
            --create-namespace \
            --values infra/helm/platform/values-hetzner.yaml \
            --values infra/helm/platform/values-observability.yaml \
            --timeout 30m

          mise exec -- helm dependency update infra/helm/observability
          mise exec -- helm upgrade --install observability infra/helm/observability \
            --namespace observability \
            --create-namespace \
            --values infra/helm/observability/values-hetzner.yaml \
            --timeout 30m

          osd_deployments="$(mise exec -- kubectl -n observability get deployment \
            -l app=rook-ceph-osd -o name)"
          test -n "$osd_deployments"

          while read -r deployment; do
            mise exec -- kubectl -n observability rollout status "$deployment" --timeout=20m
          done <<< "$osd_deployments"
