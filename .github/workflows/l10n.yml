name: L10N

on:
  push:
    branches: [main]
    paths:
      - "l10n/**"
      - "deploy/helm/l10n/**"
      - "deploy/values-l10n-production.yaml"
      - ".github/workflows/l10n.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "l10n/**"
      - "deploy/helm/l10n/**"
      - "deploy/values-l10n-production.yaml"
      - ".github/workflows/l10n.yml"

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft != true
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install dependencies
        working-directory: l10n
        run: mise run install
      - name: Build
        working-directory: l10n
        run: mise run build
      - name: Build image
        working-directory: l10n
        run: docker build --build-arg SITE_URL=https://l10n.md -t l10n-site:${GITHUB_SHA} .
      - name: Validate Helm chart
        run: |
          mise exec -- helm lint deploy/helm/l10n
          mise exec -- helm template l10n deploy/helm/l10n \
            --values deploy/values-l10n-production.yaml >/tmp/l10n-rendered.yaml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-l10n-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install tools
        run: mise install

      - name: Read kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mise exec -- op read 'op://glossia-production/kubernetes/K8S_KUBECONFIG_B64' \
            | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: l10n
          file: l10n/Dockerfile
          push: true
          build-args: |
            SITE_URL=https://l10n.md
          tags: |
            ghcr.io/${{ github.repository }}-l10n:${{ github.sha }}
            ghcr.io/${{ github.repository }}-l10n:main

      - name: Deploy to Kubernetes
        run: |
          mise exec -- helm upgrade --install l10n deploy/helm/l10n \
            --namespace glossia \
            --create-namespace \
            --values deploy/values-l10n-production.yaml \
            --set image.repository="ghcr.io/${GITHUB_REPOSITORY}-l10n" \
            --set image.tag="${GITHUB_SHA}"

          mise exec -- kubectl rollout status deployment/l10n -n glossia --timeout=5m
