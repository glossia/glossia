name: Glossia

on:
  push:
    branches: [main]
    paths:
      - "l10n/**"
      - "deploy/helm/l10n/**"
      - "deploy/values-l10n-production.yaml"
      - ".github/workflows/l10n.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "l10n/**"
      - "deploy/helm/l10n/**"
      - "deploy/values-l10n-production.yaml"
      - ".github/workflows/l10n.yml"

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft != true
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install dependencies
        working-directory: l10n
        run: mise run install
      - name: Build
        working-directory: l10n
        run: mise run build
      - name: Build image
        working-directory: l10n
        run: docker build --build-arg SITE_URL=https://l10n.md -t l10n-site:${GITHUB_SHA} .
      - name: Validate Helm chart
        run: |
          mise exec -- helm lint deploy/helm/l10n
          mise exec -- helm template l10n deploy/helm/l10n \
            --values deploy/values-l10n-production.yaml >/tmp/l10n-rendered.yaml

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      packages: write
    concurrency:
      group: deploy-l10n-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install tools
        run: mise install

      - name: Load Tailscale credentials from Infisical
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          identity-id: 5e5341af-be58-4839-a665-5d6355930102
          project-slug: glossia
          env-slug: prod
          secret-path: /tailscale-github-actions-authkey
          domain: https://eu.infisical.com

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ env.AUTHKEY }}
          ping: glossia-production-kube.tail96f99b.ts.net

      - name: Load deployment credentials from Infisical
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          identity-id: 5e5341af-be58-4839-a665-5d6355930102
          project-slug: glossia
          env-slug: prod
          secret-path: /kubernetes
          domain: https://eu.infisical.com

      - name: Write kubeconfig
        run: |
          set -euo pipefail
          test -n "${K8S_KUBECONFIG_B64:-}"
          printf '%s' "$K8S_KUBECONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          unset K8S_KUBECONFIG_B64
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: l10n
          file: l10n/Dockerfile
          push: true
          build-args: |
            SITE_URL=https://l10n.md
          tags: |
            ghcr.io/${{ github.repository }}-l10n:${{ github.sha }}
            ghcr.io/${{ github.repository }}-l10n:main

      - name: Deploy to Kubernetes
        run: |
          mise exec -- helm upgrade --install l10n deploy/helm/l10n \
            --namespace glossia \
            --create-namespace \
            --values deploy/values-l10n-production.yaml \
            --set image.repository="ghcr.io/${GITHUB_REPOSITORY}-l10n" \
            --set image.tag="${GITHUB_SHA}"

          mise exec -- kubectl rollout status deployment/l10n -n glossia --timeout=5m
