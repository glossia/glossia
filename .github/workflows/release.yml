name: Release CLI

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "cliff.toml"
      - ".github/release-notes.tmpl"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.16.0. Leave empty to calculate it from commits."
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare CLI release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!startsWith(github.event.head_commit.message, '[Release]')"
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: git-cliff

      - name: Detect releasable CLI changes
        id: detect
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
            version="${version#cli-v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=cli-v${version}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_filter=(
            --include-path 'cli/**'
            --exclude-path 'cli/.blick/**'
            --exclude-path 'cli/CHANGELOG.md'
            --exclude-path 'cli/README.md'
          )

          changelog="$(git cliff --config cliff.toml "${release_filter[@]}" --unreleased --bump 2>/dev/null || true)"
          notes_section="$(printf '%s' "${changelog}" | sed -n '/<!-- RELEASE NOTES START -->/,/<!-- generated by git-cliff -->/p')"

          if printf '%s' "${notes_section}" | grep -qE '^[[:space:]]*\* [^*]'; then
            tag_name="$(git cliff --config cliff.toml "${release_filter[@]}" --bumped-version)"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
            echo "version=${tag_name#cli-v}" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build CLI (${{ matrix.label }})
    needs: [prepare]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runs_on: ubuntu-latest
            binary_name: glossia
            archive_name: glossia-linux-x64.tar.gz
          - label: linux-arm64
            runs_on: ubuntu-24.04-arm
            binary_name: glossia
            archive_name: glossia-linux-arm64.tar.gz
          - label: darwin-x64
            runs_on: macos-15-intel
            binary_name: glossia
            archive_name: glossia-darwin-x64.tar.gz
          - label: darwin-arm64
            runs_on: macos-14
            binary_name: glossia
            archive_name: glossia-darwin-arm64.tar.gz
          - label: windows-x64
            runs_on: windows-latest
            binary_name: glossia.exe
            archive_name: glossia-windows-x64.zip
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target

      - name: Build binary
        run: cargo build --release --bin glossia

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../release
          binary="target/release/${{ matrix.binary_name }}"
          test -s "$binary"

          if [[ "${{ matrix.archive_name }}" == *.zip ]]; then
            zip -j "../release/${{ matrix.archive_name }}" "$binary"
          else
            tar -C "$(dirname "$binary")" -czf "../release/${{ matrix.archive_name }}" "${{ matrix.binary_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.label }}
          path: release/${{ matrix.archive_name }}
          if-no-files-found: error

  publish:
    name: Publish CLI release
    needs: [prepare, build]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: git-cliff

      - uses: actions/download-artifact@v5
        with:
          pattern: cli-*
          path: release
          merge-multiple: true

      - name: Generate release notes and checksums
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          set -euo pipefail
          git cliff \
            --config cliff.toml \
            --include-path 'cli/**' \
            --exclude-path 'cli/.blick/**' \
            --exclude-path 'cli/CHANGELOG.md' \
            --exclude-path 'cli/README.md' \
            --unreleased \
            --tag "${RELEASE_TAG}" \
            > release-notes.md

          (
            cd release
            sha256sum *.tar.gz *.zip > SHA256SUMS
            sha512sum *.tar.gz *.zip > SHA512SUMS
          )

      - name: Push release tag
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          set -euo pipefail
          if ! git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --latest \
            release/*
