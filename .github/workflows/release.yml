name: Release

on:
  push:
    branches:
      - main
    paths:
      - "cli/**"
      - "cliff.toml"
      - "mise/**"
      - "mise.toml"
      - ".github/release-notes.tmpl"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.16.0). Leave empty to auto-bump from conventional commits."
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare CLI release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: "!startsWith(github.event.head_commit.message, '[Release]')"
    outputs:
      should_release: ${{ steps.detect.outputs.should_release }}
      tag_name: ${{ steps.detect.outputs.tag_name }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: git-cliff

      - name: Detect releasable CLI changes
        id: detect
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            version="${INPUT_VERSION#v}"
            version="${version#cli-v}"
            tag_name="cli-v${version}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changelog="$(git cliff --config cliff.toml --include-path 'cli/**' --unreleased --bump 2>/dev/null || true)"
          notes_section="$(printf '%s' "${changelog}" | sed -n '/<!-- RELEASE NOTES START -->/,/<!-- generated by git-cliff -->/p')"

          if printf '%s' "${notes_section}" | grep -qE '^\*'; then
            tag_name="$(git cliff --config cliff.toml --include-path 'cli/**' --bumped-version)"
            version="${tag_name#cli-v}"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

  build-artifacts:
    name: Build CLI artifact (${{ matrix.label }})
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    needs: [prepare]
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runs_on: ubuntu-latest
            artifact_name: binary-linux-x64
            binary_name: glossia
          - label: linux-arm64
            runs_on: ubuntu-24.04-arm
            artifact_name: binary-linux-arm64
            binary_name: glossia
          - label: darwin-x64
            runs_on: macos-15-intel
            artifact_name: binary-darwin-x64
            binary_name: glossia
          - label: darwin-arm64
            runs_on: macos-14
            artifact_name: binary-darwin-arm64
            binary_name: glossia
          - label: windows-x64
            runs_on: windows-latest
            artifact_name: binary-windows-x64
            binary_name: glossia.exe
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
      - name: Build binary
        run: cargo build --release --bin glossia
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p "../dist/${{ matrix.artifact_name }}"
          cp "target/release/${{ matrix.binary_name }}" "../dist/${{ matrix.artifact_name }}/${{ matrix.binary_name }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  publish:
    name: Publish CLI release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [prepare, build-artifacts]
    if: needs.prepare.outputs.should_release == 'true'
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: true
          install_args: git-cliff

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/artifacts

      - name: Generate CLI changelog
        run: |
          git cliff \
            --config cliff.toml \
            --include-path 'cli/**' \
            --bump \
            --output cli/CHANGELOG.md

      - name: Generate release notes
        run: |
          git cliff \
            --config cliff.toml \
            --include-path 'cli/**' \
            --unreleased \
            --tag "${RELEASE_TAG}" \
            > release-notes.md

      - name: Commit changelog and tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add cli/CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "[Release] glossia ${RELEASE_TAG}"
          fi

          if ! git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag "${RELEASE_TAG}"
          fi

      - name: Build archives and checksums
        shell: bash
        run: |
          mkdir -p release

          tar -C dist/artifacts/binary-linux-x64 -czf release/glossia-linux-x64.tar.gz glossia
          tar -C dist/artifacts/binary-linux-arm64 -czf release/glossia-linux-arm64.tar.gz glossia
          tar -C dist/artifacts/binary-darwin-x64 -czf release/glossia-darwin-x64.tar.gz glossia
          tar -C dist/artifacts/binary-darwin-arm64 -czf release/glossia-darwin-arm64.tar.gz glossia
          (
            cd dist/artifacts/binary-windows-x64
            zip -q "${GITHUB_WORKSPACE}/release/glossia-windows-x64.zip" glossia.exe
          )

          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS
          sha512sum *.tar.gz *.zip > SHA512SUMS

      - name: Push release commit and tag
        run: git push origin main --follow-tags

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          files: release/*
