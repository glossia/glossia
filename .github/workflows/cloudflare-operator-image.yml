name: Cloudflare Operator Image

# PR validation + image build for cloudflare-operator, the Kubernetes
# controller that reconciles CRDs under cloudflare.glossia.ai against
# the Cloudflare API so zone-level configuration (rate limits, Web
# Application Firewall custom rules, and Turnstile widgets) lives in
# git.

on:
  push:
    branches:
      - main
    paths:
      - "infra/cloudflare-operator/**"
      - ".github/workflows/cloudflare-operator-image.yml"
  pull_request:
    paths:
      - "infra/cloudflare-operator/**"
      - ".github/workflows/cloudflare-operator-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: glossia/cloudflare-operator

jobs:
  test:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    # Fork pull requests never need access to the Hetzner runner cluster.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'hetzner-docker' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: infra/cloudflare-operator/go.mod
          cache-dependency-path: infra/cloudflare-operator/go.sum
      # Install kube-apiserver + etcd binaries so the envtest suite in
      # controllers/envtest_test.go actually runs (it skips when
      # KUBEBUILDER_ASSETS is unset). This exercises CRD admission:
      # CEL rules for immutable zoneId, cf.colo.id requirement, and
      # adopt-or-create - which the fake-client tests cannot cover.
      - name: Install envtest binaries
        working-directory: infra/cloudflare-operator
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.32.0 --bin-dir /tmp/envtest -p path)" >> "$GITHUB_ENV"
      - name: Test
        working-directory: infra/cloudflare-operator
        run: go test ./...
      - name: Vet
        working-directory: infra/cloudflare-operator
        run: go vet ./...

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: hetzner-docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          GIT_SHA="${GITHUB_SHA::12}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${GIT_SHA}"
            echo "${IMAGE}:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./infra
          file: infra/cloudflare-operator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=LicenseRef-O-Saasy
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=cloudflare-operator
          cache-to: type=gha,mode=max,scope=cloudflare-operator
