name: App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "ee/**"
      # Translation checkpoints are content and lockfile updates. Building and
      # deploying the application for each one restarts the model gateway while
      # the same translation session is still using it.
      - "!app/priv/i18n/**"
      - "!app/priv/gettext/*/LC_MESSAGES/**"
      - "cli/**"
      - "mise/**"
      - "mise.toml"
      - ".github/workflows/app.yml"
      - ".github/workflows/deploy.yml"
      - "sdk/web/**"
      - "LICENSE.md"
      - "LICENSE-APACHE"
      - ".github/scripts/*app*.sh"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - "ee/**"
      - "!app/priv/i18n/**"
      - "!app/priv/gettext/*/LC_MESSAGES/**"
      - "cli/**"
      - "mise/**"
      - "mise.toml"
      - ".github/workflows/app.yml"
      - ".github/workflows/deploy.yml"
      - "sdk/web/**"
      - "LICENSE.md"
      - "LICENSE-APACHE"
      - ".github/scripts/*app*.sh"

permissions:
  contents: read

env:
  # GitHub release redirects exceed :httpc's header limit on current OTP.
  # Use mise's Rust toolchain for all NIFs until rustler_precompiled ships
  # https://github.com/philss/rustler_precompiled/pull/113.
  RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: "true"
  # Lumis's vendored Perl parser declares bsearch, which conflicts with
  # glibc 2.43's C23 macro on Ubuntu 26.04. Keep native C builds on GNU C17.
  CFLAGS: "-std=gnu17"

# Both PR checks and post-merge checks use hosted runners. Image publication
# waits for the post-merge checks, so an unavailable self-hosted runner would
# otherwise leave production on an old image even after a fix has merged.
jobs:
  build:
    if: github.event.pull_request.draft != true
    name: ${{ matrix.edition == 'core' && 'Build' || 'Build (enterprise)' }}
    strategy:
      matrix:
        edition: [core, enterprise]
    env:
      GLOSSIA_EDITION: ${{ matrix.edition }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          cache: true
      - name: Install tools
        run: mise install
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-ng-dev
      - name: Install dependencies
        run: mix deps.get
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors
      - name: Check gettext .pot / .po files are up to date
        run: |
          mix gettext.extract --merge --check-up-to-date
          if [ -n "$(git status --porcelain priv/gettext ../ee/priv/gettext)" ]; then
            echo "::error::Gettext files are stale. Run 'mix gettext.extract --merge' in app/ and commit the result."
            git status --porcelain priv/gettext ../ee/priv/gettext
            exit 1
          fi

  test:
    if: github.event.pull_request.draft != true
    name: ${{ matrix.edition == 'core' && 'Test' || 'Test (enterprise)' }}
    strategy:
      matrix:
        edition: [core, enterprise]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24.12-alpine
        env:
          CLICKHOUSE_DB: glossia_test
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 8123:8123
    env:
      MIX_ENV: test
      GLOSSIA_EDITION: ${{ matrix.edition }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          cache: true
      - name: Install tools
        run: mise install
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-ng-dev
      - name: Install dependencies
        run: mix deps.get
      - name: Wait for ClickHouse
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8123/ping | grep -q "Ok."; then
              echo "ClickHouse is ready"
              exit 0
            fi

            echo "Waiting for ClickHouse... ($attempt/30)"
            sleep 2
          done

          echo "::error::ClickHouse did not become ready in time"
          exit 1
      - name: Ensure ClickHouse test database exists
        run: |
          curl --fail --show-error --silent \
            -X POST \
            "http://localhost:8123/" \
            --data-binary "CREATE DATABASE IF NOT EXISTS glossia_test"
      - name: Run test suite
        # Social-image template tests embed the compiled Noora stylesheet.
        # Build only that bundle; the test suite does not need the browser scripts.
        run: |
          mix esbuild noora
          mix test

  lint:
    if: github.event.pull_request.draft != true
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.2
          cache: true
      - name: Install tools
        run: mise install
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcap-ng-dev
      - name: Install dependencies
        run: mix deps.get
      - name: Format check (Quokka + Phoenix formatter)
        run: mix format --check-formatted
