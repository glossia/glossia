name: Publish Production Images

on:
  workflow_run:
    workflows:
      - App
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

# Like Tuist's server releases, serialize detection through publication: two
# merges must not calculate the same next version. Never interrupt a release
# halfway through publishing its two editions. Pending merges are cumulative.
concurrency:
  group: release-app-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare app release
    # workflow_run is privileged even when the triggering run came from a PR.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_publish: ${{ steps.current.outputs.should_publish }}
      should_release: ${{ steps.release.outputs.should_release }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      build_version: ${{ steps.release.outputs.build_version }}
    steps:
      - name: Checkout tested commit and release tags
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Ignore superseded runs
        id: current
        run: |
          set -euo pipefail
          # Checks may finish out of order. An old run must not move main or
          # latest backwards, or create a release behind a newer app tag.
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
            echo 'should_publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: jdx/mise-action@v2
        if: steps.current.outputs.should_publish == 'true'
        with:
          version: 2026.9.2
          cache: true
          install_args: git-cliff

      - name: Detect releasable app changes
        if: steps.current.outputs.should_publish == 'true'
        id: release
        run: bash .github/scripts/prepare-app-release.sh

      - name: Preserve release notes
        if: steps.release.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-notes
          path: app-release-notes.md
          if-no-files-found: error

  publish:
    name: Publish Image (${{ matrix.flavor }})
    needs: [prepare]
    if: needs.prepare.outputs.should_publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: core
            flavor: community
            licenses: Apache-2.0
          - edition: enterprise
            flavor: enterprise
            licenses: Apache-2.0 AND LicenseRef-Glossia-Enterprise
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine image tags
        id: tags
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
          RUN_NUMBER: ${{ github.run_number }}
          EDITION: ${{ matrix.edition }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash .github/scripts/app-image-tags.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: app
          file: app/Dockerfile
          build-contexts: |
            cli=./cli
            sdk=./sdk
            ee=./ee
            licensing=.
          build-args: |
            GLOSSIA_EDITION=${{ matrix.edition }}
            GLOSSIA_VERSION=${{ needs.prepare.outputs.build_version }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.build_version }}
            org.opencontainers.image.title=Glossia (${{ matrix.flavor }})
            org.opencontainers.image.licenses=${{ matrix.licenses }}
          tags: ${{ steps.tags.outputs.tags }}

  release:
    name: Publish app release
    needs: [prepare, publish]
    # The matrix must finish successfully for BOTH editions before the tag and
    # GitHub Release are created. Pin the tag to the tested commit, never main.
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: app-release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Markdown backticks are literal, not shell command substitutions.
          # shellcheck disable=SC2016
          {
            printf '## Container images\n\n'
            printf -- '- Community (Apache-2.0): `ghcr.io/%s:%s-community`\n' "$GH_REPO" "$VERSION"
            printf -- '- Enterprise (commercial license required for production): `ghcr.io/%s:%s-enterprise`\n\n' "$GH_REPO" "$VERSION"
            printf 'Source commit: `%s`\n\n' "$REVISION"
            cat app-release-notes.md
          } > release-notes.md
          gh release create "$RELEASE_TAG" \
            --target "$REVISION" \
            --title "Glossia app $VERSION" \
            --notes-file release-notes.md \
            --latest=false
