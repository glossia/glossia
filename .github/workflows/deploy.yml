name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "cli/**"
      - "deploy/helm/glossia/**"
      - "deploy/values-production.yaml"
      - "infra/helm/platform/**"
      - "mise/**"
      - "mise.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install tools
        run: mise install

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: glossia-production-kube.tail96f99b.ts.net

      - name: Read kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          set -euo pipefail
          umask 077

          kubeconfig="$RUNNER_TEMP/kubeconfig"
          kubeconfig_base64=""
          secret_ref='op://glossia-production/kubernetes/K8S_KUBECONFIG_B64'
          max_attempts=5

          # A healthy `op read` answers in well under a second, so this bound
          # exists to turn a hung read into a retry rather than to police a slow
          # one — hence the generous headroom. `timeout` sends TERM to the whole
          # process group (so `op` dies with `mise exec`, and nothing is left
          # holding the command substitution's pipe open); `-k` escalates to KILL
          # for the case where `op` ignores that TERM. Do not add --foreground:
          # it exempts children from the timeout, which is the hang this avoids.
          read_timeout=60s
          kill_grace=5s

          for (( attempt = 1; attempt <= max_attempts; attempt++ )); do
            reason=""

            if kubeconfig_base64="$(timeout -k "$kill_grace" "$read_timeout" \
              mise exec -- op read "$secret_ref")"; then
              if [[ -n "$kubeconfig_base64" ]]; then
                break
              fi
              reason="1Password returned an empty value"
            else
              rc=$?
              case "$rc" in
                124) reason="the read timed out after $read_timeout" ;;
                137) reason="the read ignored SIGTERM and was killed after $read_timeout" ;;
                *) reason="op exited with status $rc" ;;
              esac
            fi

            if (( attempt == max_attempts )); then
              echo "Failed to read the production kubeconfig after $attempt attempts: $reason." >&2
              exit 1
            fi

            retry_delay=$((attempt * 10))
            echo "Could not read the production kubeconfig ($reason). Retrying in ${retry_delay}s." >&2
            sleep "$retry_delay"
          done

          printf '%s' "$kubeconfig_base64" | base64 --decode > "$kubeconfig"
          unset kubeconfig_base64

          test -s "$kubeconfig"
          chmod 600 "$kubeconfig"
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Verify cluster reachability
        # Fail fast if the 1P-stored kubeconfig points at an unreachable
        # apiserver. Without this, the helm steps below would hang for their
        # full --timeout on a phantom kubeconfig and we'd find out only after a
        # partial rollout.
        #
        # `/version` is a static reachability probe. `/readyz` also reports
        # control-plane readiness, which returns non-200 while any single
        # readiness gate is unsatisfied — an etcd hiccup, an informer still
        # syncing, a shutdown grace period during an apiserver rollout — and
        # would abort a deploy the cluster is perfectly able to serve.
        run: |
          set -euo pipefail
          api="$(mise exec -- kubectl config view --minify --raw \
            -o jsonpath='{.clusters[0].cluster.server}')"
          echo "Reaching apiserver at $api"
          mise exec -- kubectl --request-timeout=10s get --raw /version >/dev/null

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: app
          file: app/Dockerfile
          build-contexts: |
            cli=./cli
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main

      - name: Deploy platform
        run: |
          mise exec -- kubectl create namespace glossia --dry-run=client -o yaml | mise exec -- kubectl apply -f -
          mise exec -- kubectl create namespace platform --dry-run=client -o yaml | mise exec -- kubectl apply -f -
          mise exec -- kubectl label --overwrite namespace platform \
            pod-security.kubernetes.io/enforce=privileged \
            pod-security.kubernetes.io/audit=privileged \
            pod-security.kubernetes.io/warn=privileged

          mise exec -- helm dependency update infra/helm/platform
          if ! mise exec -- helm status platform --namespace platform >/dev/null 2>&1; then
            mise exec -- helm upgrade --install platform infra/helm/platform \
              --namespace platform \
              --create-namespace \
              --values infra/helm/platform/values-hetzner.yaml \
              --set rook-ceph-cluster.enabled=false \
              --set rookObjectStorage.enabled=false \
              --set releaseObjectStorage.enabled=false
          fi

          mise exec -- kubectl wait --for=condition=Established \
            crd/cephclusters.ceph.rook.io \
            crd/cephobjectstores.ceph.rook.io \
            crd/objectbucketclaims.objectbucket.io \
            --timeout=5m

          mise exec -- helm upgrade --install platform infra/helm/platform \
            --namespace platform \
            --create-namespace \
            --values infra/helm/platform/values-hetzner.yaml

          mise exec -- kubectl -n glossia wait --for=create secret/glossia-s3 --timeout=30m
          mise exec -- kubectl -n platform wait --for=create secret/glossia-releases --timeout=30m

      - name: Deploy to Kubernetes
        run: |
          mise exec -- helm upgrade --install glossia deploy/helm/glossia \
            --namespace glossia \
            --create-namespace \
            --values deploy/values-production.yaml \
            --set image.repository="ghcr.io/${GITHUB_REPOSITORY}" \
            --set image.tag="${GITHUB_SHA}"

          mise exec -- kubectl rollout status deployment/glossia -n glossia --timeout=10m
