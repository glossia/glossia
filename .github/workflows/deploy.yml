name: Publish Production Image

on:
  workflow_run:
    workflows:
      - App
    branches:
      - main
    types:
      - completed

jobs:
  publish:
    name: Publish Image (${{ matrix.edition }})
    strategy:
      matrix:
        include:
          - edition: core
            suffix: ""
            licenses: Apache-2.0
          - edition: enterprise
            suffix: -enterprise
            licenses: Apache-2.0 AND LicenseRef-Glossia-Enterprise
    # workflow_run is privileged even when the triggering run came from a PR.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    # Keep publication independent of self-hosted runner availability too.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-production-image-${{ matrix.edition }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: app
          file: app/Dockerfile
          build-contexts: |
            cli=./cli
            sdk=./sdk
            ee=./ee
            licensing=.
          build-args: |
            GLOSSIA_EDITION=${{ matrix.edition }}
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}${{ matrix.suffix }}
            ghcr.io/${{ github.repository }}:main${{ matrix.suffix }}
            ghcr.io/${{ github.repository }}:main-${{ github.run_number }}-${{ github.event.workflow_run.head_sha }}${{ matrix.suffix }}
