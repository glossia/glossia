name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "deploy/helm/glossia/**"
      - "deploy/values-production.yaml"
      - "infra/helm/platform/**"
      - "mise/**"
      - "mise.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up mise
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install tools
        run: mise install

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: glossia-production-kube.tail96f99b.ts.net

      - name: Read kubeconfig from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mise exec -- op read 'op://glossia-production/kubernetes/K8S_KUBECONFIG_B64' \
            | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: app
          file: app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:main

      - name: Deploy platform
        run: |
          mise exec -- kubectl create namespace glossia --dry-run=client -o yaml | mise exec -- kubectl apply -f -
          mise exec -- kubectl create namespace platform --dry-run=client -o yaml | mise exec -- kubectl apply -f -
          mise exec -- kubectl label --overwrite namespace platform \
            pod-security.kubernetes.io/enforce=privileged \
            pod-security.kubernetes.io/audit=privileged \
            pod-security.kubernetes.io/warn=privileged

          mise exec -- helm dependency update infra/helm/platform
          if ! mise exec -- helm status platform --namespace platform >/dev/null 2>&1; then
            mise exec -- helm upgrade --install platform infra/helm/platform \
              --namespace platform \
              --create-namespace \
              --values infra/helm/platform/values-hetzner.yaml \
              --set rook-ceph-cluster.enabled=false \
              --set rookObjectStorage.enabled=false
          fi

          mise exec -- kubectl wait --for=condition=Established \
            crd/cephclusters.ceph.rook.io \
            crd/cephobjectstores.ceph.rook.io \
            crd/objectbucketclaims.objectbucket.io \
            --timeout=5m

          mise exec -- helm upgrade --install platform infra/helm/platform \
            --namespace platform \
            --create-namespace \
            --values infra/helm/platform/values-hetzner.yaml

          mise exec -- kubectl -n glossia wait --for=create secret/glossia-s3 --timeout=30m

      - name: Deploy to Kubernetes
        run: |
          mise exec -- helm upgrade --install glossia deploy/helm/glossia \
            --namespace glossia \
            --create-namespace \
            --values deploy/values-production.yaml \
            --set image.repository="ghcr.io/${GITHUB_REPOSITORY}" \
            --set image.tag="${GITHUB_SHA}"

          mise exec -- kubectl rollout status deployment/glossia -n glossia --timeout=10m
