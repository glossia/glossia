name: Helm chart

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/glossia/**"
      - ".github/workflows/helm.yml"
  pull_request:
    branches: [main]
    paths:
      - "deploy/helm/glossia/**"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate self-hosting chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: azure/setup-helm@v4

      - name: Validate chart
        run: |
          set -euo pipefail
          helm dependency build deploy/helm/glossia
          helm lint deploy/helm/glossia
          helm template glossia deploy/helm/glossia >/tmp/glossia-chart.yaml
