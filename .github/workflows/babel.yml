name: Babel

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "babel/**"
      - "mise/**"
      - "mise.toml"
      - ".github/workflows/babel.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "babel/**"
      - "mise/**"
      - "mise.toml"
      - ".github/workflows/babel.yml"

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft != true
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: babel
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install tools
        run: mise install
      - name: Install dependencies
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors

  test:
    if: github.event.pull_request.draft != true
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: babel
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install tools
        run: mise install
      - name: Install dependencies
        run: mix deps.get
      - name: Run test suite
        run: mix test

  lint:
    if: github.event.pull_request.draft != true
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: babel
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - name: Install tools
        run: mise install
      - name: Install dependencies
        run: mix deps.get
      - name: Format check
        run: mix format --check-formatted
      - name: Static analysis
        run: mix credo --strict
