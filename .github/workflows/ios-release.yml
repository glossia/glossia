name: iOS release

on:
  workflow_run:
    workflows: [Mobile Native]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Keep version selection, Apple upload and tagging in one queue, as in Habibi.
concurrency:
  group: glossia-ios-release
  cancel-in-progress: false

jobs:
  version:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release: ${{ steps.version.outputs.should-release }}
      version: ${{ steps.version.outputs.next-version-number }}
      tag: ${{ steps.version.outputs.next-version }}
      build: ${{ steps.version.outputs.build-number }}
      sha: ${{ steps.current.outputs.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Ignore superseded runs
        id: current
        run: |
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        if: steps.current.outputs.sha != ''
        with:
          version: '2026.9.2'
          install_args: 'git-cliff'
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - id: version
        if: steps.current.outputs.sha != ''
        run: bash mobile/native/ios/distribution/check.sh
      - name: Explain pending credential setup
        if: vars.IOS_INFISICAL_IDENTITY_ID == ''
        run: echo 'Uploads disabled until IOS_INFISICAL_IDENTITY_ID and Apple secrets are configured.' >> "$GITHUB_STEP_SUMMARY"

  upload:
    needs: version
    if: needs.version.outputs.release == 'true' && vars.IOS_INFISICAL_IDENTITY_ID != ''
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD: ${{ needs.version.outputs.build }}
      TAG: ${{ needs.version.outputs.tag }}
      SOURCE_SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: '2026.9.2'
          install_args: 'git-cliff'
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          version: '2026.9.2'
          working_directory: mobile/native
          install_args: 'rust github:tuist/once'
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - name: Prepare release notes
        run: bash mobile/native/ios/distribution/check.sh notes > "$RUNNER_TEMP/ios-release-notes.md"
      # Dependency installers and build scripts must not inherit private keys.
      - name: Build device app before loading credentials
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26
          mise -C mobile/native exec -- rustup target add aarch64-apple-ios
          mise -C mobile/native run build:ios-device
      - name: Load dedicated iOS signing and upload credentials
        uses: Infisical/secrets-action@8a06c1bdcd5b8635d510c52d4b57a92c1ccef785 # v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.IOS_INFISICAL_IDENTITY_ID }}
          oidc-audience: https://github.com/glossia
          project-slug: glossia
          env-slug: prod
          secret-path: /glossia-ios-releases
          include-imports: false
          domain: https://eu.infisical.com
      - name: Check upload credentials
        run: bash mobile/native/ios/distribution/upload.sh check
      - name: Sign app and extension, then package
        run: bash mobile/native/ios/distribution/bundle.sh "$VERSION" "$BUILD" "$RUNNER_TEMP/Glossia.ipa"
      - name: Validate with App Store Connect
        run: bash mobile/native/ios/distribution/upload.sh validate "$RUNNER_TEMP/Glossia.ipa"
      - name: Upload to App Store Connect
        run: bash mobile/native/ios/distribution/upload.sh upload "$RUNNER_TEMP/Glossia.ipa"
      - name: Record the uploaded release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\nApp Store Connect upload: Glossia %s (%s).\n' "$VERSION" "$BUILD" >> "$RUNNER_TEMP/ios-release-notes.md"
          gh release create "$TAG" --target "$SOURCE_SHA" --title "Glossia iOS $VERSION" \
            --notes-file "$RUNNER_TEMP/ios-release-notes.md" --latest=false
