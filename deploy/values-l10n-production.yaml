# Production overrides for the L10N.md static-site Helm chart.

fullnameOverride: l10n

replicaCount: 2

# Reuses the pull Secret provisioned in the glossia namespace by the main
# Glossia chart's ExternalSecret integration.
imagePullSecrets:
  - name: ghcr-pull-secret

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: l10n.md
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 256Mi
