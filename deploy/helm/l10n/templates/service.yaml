apiVersion: v1
kind: Service
metadata:
  name: {{ include "l10n.fullname" . }}
  labels:
    {{- include "l10n.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "l10n.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
