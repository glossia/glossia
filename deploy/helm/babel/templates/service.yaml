apiVersion: v1
kind: Service
metadata:
  name: {{ include "babel.fullname" . }}
  labels:
    {{- include "babel.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "babel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
