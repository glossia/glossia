apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "babel.fullname" . }}
  labels:
    {{- include "babel.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "babel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "babel.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "babel.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "babel.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELEASE_DISTRIBUTION
              value: "name"
            - name: RELEASE_NODE
              value: "babel@$(POD_IP)"
            - name: BABEL_DNS_CLUSTER_QUERY
              value: {{ include "babel.headlessServiceFQDN" . | quote }}
            {{- if .Values.glossia.enabled }}
            - name: BABEL_GLOSSIA_INTERNAL_URL
              value: {{ required "glossia.internalURL is required when glossia.enabled=true" .Values.glossia.internalURL | quote }}
            - name: BABEL_GLOSSIA_TLS_SERVER_NAME
              value: {{ required "glossia.tlsServerName is required when glossia.enabled=true" .Values.glossia.tlsServerName | quote }}
            - name: BABEL_GLOSSIA_TOKEN_PATH
              value: {{ printf "%s/token" .Values.glossia.tokenMountPath | quote }}
            {{- end }}
            {{- range $key, $value := omit .Values.env "POD_IP" "RELEASE_DISTRIBUTION" "RELEASE_NODE" "BABEL_DNS_CLUSTER_QUERY" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.envSecretName }}
          {{- if .Values.glossia.enabled }}
          volumeMounts:
            - name: glossia-token
              mountPath: {{ .Values.glossia.tokenMountPath | quote }}
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.glossia.enabled }}
      volumes:
        - name: glossia-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ .Values.glossia.tokenAudience | quote }}
                  expirationSeconds: {{ .Values.glossia.tokenExpirationSeconds }}
      {{- end }}
