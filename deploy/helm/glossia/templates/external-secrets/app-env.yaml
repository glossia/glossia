{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.envSecretName }}
  labels:
    {{- include "glossia.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.secrets.envSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GLOSSIA_DATABASE_URL: {{ printf "ecto://%s:{{ .%s | urlquery }}@%s/%s" .Values.postgres.user .Values.externalSecrets.postgres.passwordField (include "glossia.postgresHost" .) .Values.postgres.database | quote }}
        GLOSSIA_CLICKHOUSE_URL: {{ printf "http://%s:%d/%s" (include "glossia.clickhouseHost" .) (int .Values.clickhouse.port) .Values.clickhouse.database | quote }}
        {{- if .Values.clickhouse.babelReadonly.enabled }}
        GLOSSIA_CLICKHOUSE_READONLY_URL: {{ printf "http://%s:{{ .%s | urlquery }}@%s:%d/%s" .Values.clickhouse.babelReadonly.username .Values.externalSecrets.clickhouseBabel.passwordField (include "glossia.clickhouseHost" .) (int .Values.clickhouse.port) .Values.clickhouse.database | quote }}
        {{- end }}
        {{- range $key, $remoteKey := .Values.externalSecrets.appEnv.fields }}
        {{- if $remoteKey }}
        {{ $key }}: {{ printf "{{ .%s }}" $remoteKey | quote }}
        {{- end }}
        {{- end }}
        {{- if .Values.turnstile.enabled }}
        GLOSSIA_TURNSTILE_SITE_KEY: {{ printf "{{ .%s }}" .Values.turnstile.siteKeyField | quote }}
        GLOSSIA_TURNSTILE_SECRET_KEY: {{ printf "{{ .%s }}" .Values.turnstile.secretKeyField | quote }}
        {{- end }}
  data:
    {{- range $remoteKey := values .Values.externalSecrets.appEnv.fields | uniq | sortAlpha }}
    {{- if $remoteKey }}
    - secretKey: {{ $remoteKey }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.externalSecrets.appEnv.itemKey $remoteKey | quote }}
    {{- end }}
    {{- end }}
    {{- if .Values.turnstile.enabled }}
    - secretKey: {{ .Values.turnstile.siteKeyField }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.appEnv.itemKey .Values.turnstile.siteKeyField | quote }}
    - secretKey: {{ .Values.turnstile.secretKeyField }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.appEnv.itemKey .Values.turnstile.secretKeyField | quote }}
    {{- end }}
    - secretKey: {{ .Values.externalSecrets.postgres.passwordField }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.postgres.itemKey .Values.externalSecrets.postgres.passwordField | quote }}
    {{- if .Values.clickhouse.babelReadonly.enabled }}
    - secretKey: {{ .Values.externalSecrets.clickhouseBabel.passwordField }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.clickhouseBabel.itemKey .Values.externalSecrets.clickhouseBabel.passwordField | quote }}
    {{- end }}
{{- end }}
