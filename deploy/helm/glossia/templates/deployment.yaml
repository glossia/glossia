apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glossia.fullname" . }}
  labels:
    {{- include "glossia.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "glossia.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "glossia.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.mailRelay.enabled }}
            - name: GLOSSIA_SMTP_HOST
              value: {{ required "mailRelay.host is required when mailRelay.enabled=true" .Values.mailRelay.host | quote }}
            - name: GLOSSIA_SMTP_PORT
              value: {{ .Values.mailRelay.port | quote }}
            - name: GLOSSIA_SMTP_TLS
              value: {{ .Values.mailRelay.tls | quote }}
            - name: GLOSSIA_SMTP_AUTH
              value: {{ .Values.mailRelay.auth | quote }}
            {{- end }}
            {{- if .Values.objectStorage.rook.enabled }}
            - name: GLOSSIA_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.rook.bucketSecretName | quote }}
                  key: {{ .Values.objectStorage.rook.accessKeyIdKey | quote }}
            - name: GLOSSIA_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.rook.bucketSecretName | quote }}
                  key: {{ .Values.objectStorage.rook.secretAccessKeyKey | quote }}
            - name: GLOSSIA_S3_ENDPOINT
              value: {{ required "objectStorage.rook.endpointURL is required when objectStorage.rook.enabled=true" .Values.objectStorage.rook.endpointURL | quote }}
            - name: GLOSSIA_S3_REGION
              value: {{ .Values.objectStorage.rook.region | quote }}
            - name: GLOSSIA_S3_BUCKET
              value: {{ required "objectStorage.rook.bucketName is required when objectStorage.rook.enabled=true" .Values.objectStorage.rook.bucketName | quote }}
            {{- end }}
            - name: GLOSSIA_DNS_CLUSTER_QUERY
              value: {{ include "glossia.headlessServiceFQDN" . | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.envSecretName }}
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
