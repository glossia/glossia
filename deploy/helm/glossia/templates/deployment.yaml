apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "glossia.fullname" . }}
  labels:
    {{- include "glossia.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "glossia.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "glossia.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "glossia.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
            {{- if .Values.internalBabel.enabled }}
            - name: babel-https
              containerPort: {{ .Values.internalBabel.tls.targetPort }}
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RELEASE_DISTRIBUTION
              value: "name"
            - name: RELEASE_NODE
              value: "glossia@$(POD_IP)"
            {{- /*
              Erlang distribution picks a random listen port on every boot,
              which no firewall or network policy can name. Pin it so the
              policy below can allow exactly this port between the pods that
              make up the cluster. Set here rather than in the release's
              env.sh so the port and the policy that opens it move together in
              a single chart upgrade.
            */}}
            - name: ERL_AFLAGS
              value: "-kernel inet_dist_listen_min {{ .Values.clustering.distributionPortMin }} inet_dist_listen_max {{ .Values.clustering.distributionPortMax }}"
            {{- if .Values.internalBabel.enabled }}
            - name: GLOSSIA_BABEL_DATABASE_READONLY_ROLE
              value: {{ .Values.internalBabel.databaseReadonlyRole | quote }}
            - name: GLOSSIA_BABEL_TOKEN_ISSUER
              value: {{ required "internalBabel.token.issuer is required when internalBabel.enabled=true" .Values.internalBabel.token.issuer | quote }}
            - name: GLOSSIA_BABEL_TOKEN_AUDIENCE
              value: {{ .Values.internalBabel.token.audience | quote }}
            - name: GLOSSIA_BABEL_TOKEN_JWKS
              value: {{ required "internalBabel.token.jwks is required when internalBabel.enabled=true" .Values.internalBabel.token.jwks | quote }}
            - name: GLOSSIA_BABEL_TOKEN_MAX_LIFETIME_SECONDS
              value: {{ .Values.internalBabel.token.maxLifetimeSeconds | quote }}
            - name: GLOSSIA_BABEL_TOKEN_NAMESPACE
              value: {{ .Values.internalBabel.token.namespace | quote }}
            - name: GLOSSIA_BABEL_TOKEN_SERVICE_ACCOUNT
              value: {{ .Values.internalBabel.token.serviceAccount | quote }}
            - name: GLOSSIA_BABEL_INTERNAL_TLS_CERT_PATH
              value: /var/run/secrets/glossia-babel-internal/tls.crt
            - name: GLOSSIA_BABEL_INTERNAL_TLS_KEY_PATH
              value: /var/run/secrets/glossia-babel-internal/tls.key
            {{- end }}
            {{- range $key, $value := omit .Values.env "ERL_AFLAGS" "POD_NAME" "POD_NAMESPACE" "POD_IP" "RELEASE_DISTRIBUTION" "RELEASE_NODE" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- include "glossia.mailRelayEnv" . | nindent 12 }}
            {{- if and .Values.objectStorage.enabled .Values.objectStorage.rook.enabled }}
            {{- fail "objectStorage.enabled and objectStorage.rook.enabled cannot both be true" }}
            {{- end }}
            {{- if .Values.objectStorage.enabled }}
            - name: GLOSSIA_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.secretName | quote }}
                  key: {{ .Values.objectStorage.accessKeyIdKey | quote }}
            - name: GLOSSIA_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.secretName | quote }}
                  key: {{ .Values.objectStorage.secretAccessKeyKey | quote }}
            - name: GLOSSIA_S3_ENDPOINT
              value: {{ required "objectStorage.endpointURL is required when objectStorage.enabled=true" .Values.objectStorage.endpointURL | quote }}
            - name: GLOSSIA_S3_REGION
              value: {{ required "objectStorage.region is required when objectStorage.enabled=true" .Values.objectStorage.region | quote }}
            - name: GLOSSIA_S3_BUCKET
              value: {{ required "objectStorage.bucketName is required when objectStorage.enabled=true" .Values.objectStorage.bucketName | quote }}
            {{- else if .Values.objectStorage.rook.enabled }}
            - name: GLOSSIA_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.rook.bucketSecretName | quote }}
                  key: {{ .Values.objectStorage.rook.accessKeyIdKey | quote }}
            - name: GLOSSIA_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.objectStorage.rook.bucketSecretName | quote }}
                  key: {{ .Values.objectStorage.rook.secretAccessKeyKey | quote }}
            - name: GLOSSIA_S3_ENDPOINT
              value: {{ required "objectStorage.rook.endpointURL is required when objectStorage.rook.enabled=true" .Values.objectStorage.rook.endpointURL | quote }}
            - name: GLOSSIA_S3_REGION
              value: {{ .Values.objectStorage.rook.region | quote }}
            - name: GLOSSIA_S3_BUCKET
              value: {{ required "objectStorage.rook.bucketName is required when objectStorage.rook.enabled=true" .Values.objectStorage.rook.bucketName | quote }}
            {{- end }}
            {{- if .Values.smolanalytics.enabled }}
            - name: GLOSSIA_SMOLANALYTICS_URL
              value: {{ printf "http://%s:8080" (include "glossia.smolanalyticsName" .) | quote }}
            - name: GLOSSIA_SMOLANALYTICS_WRITE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.smolanalytics.secretName | quote }}
                  key: {{ .Values.smolanalytics.writeKeyKey | quote }}
            {{- end }}
            {{- if .Values.typesense.enabled }}
            - name: GLOSSIA_TYPESENSE_URL
              value: {{ printf "http://%s:%v" (include "glossia.typesenseName" .) .Values.typesense.port | quote }}
            - name: GLOSSIA_TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.typesense.secretName | quote }}
                  key: {{ .Values.typesense.apiKeyKey | quote }}
            {{- end }}
            - name: GLOSSIA_DNS_CLUSTER_QUERY
              value: {{ include "glossia.headlessServiceFQDN" . | quote }}
            {{- if .Values.turnstile.enabled }}
            - name: GLOSSIA_TURNSTILE_ENABLED
              value: "1"
            # GLOSSIA_TURNSTILE_SITE_KEY + GLOSSIA_TURNSTILE_SECRET_KEY
            # come from the operator-materialized Secret created by the
            # CloudflareTurnstileWidget CR in glossia/infra. Explicit
            # valueFrom (not envFrom) so the operator's Secret data
            # keys stay decoupled from the app's env-var naming - the
            # CR names the keys, the deployment renames them into the
            # GLOSSIA_ prefix its runtime.exs expects. No Infisical
            # round-trip because the ESO Infisical provider does not
            # implement PushSecret.
            - name: GLOSSIA_TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.turnstile.secretName | default "turnstile-signup" }}
                  key: {{ .Values.turnstile.siteKeyKey | default "TURNSTILE_SITE_KEY" }}
            - name: GLOSSIA_TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.turnstile.secretName | default "turnstile-signup" }}
                  key: {{ .Values.turnstile.secretKeyKey | default "TURNSTILE_SECRET_KEY" }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.envSecretName }}
          {{- if .Values.internalBabel.enabled }}
          volumeMounts:
            - name: babel-internal-tls
              mountPath: /var/run/secrets/glossia-babel-internal
              readOnly: true
          {{- end }}
          # Guard the boot separately from liveness. A cold BEAM start behind
          # an image pull, DB connect and migration wait can exceed the
          # liveness initialDelay, and without a startupProbe liveness then
          # restarts the pod mid-boot into a crash loop - worst during a node
          # rollout when both replicas are cold. 30 x 5s = 150s of boot budget.
          startupProbe:
            httpGet:
              path: /up
              port: http
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.internalBabel.enabled }}
      volumes:
        - name: babel-internal-tls
          secret:
            secretName: {{ .Values.internalBabel.tls.certificateSecretName | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
