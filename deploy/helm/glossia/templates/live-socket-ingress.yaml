{{- if and .Values.ingress.enabled .Values.ingress.liveSocket.affinity }}
{{- /*
  A LiveView connection is per-replica state. The long-poll transport keeps its
  session in a process on the node that opened it, and the replicas do not form
  an Erlang cluster, so a poll answered by the other pod finds nothing and the
  join never completes. The client then sits on the dead server render forever:
  the page looks right, but no hook ever mounts, so every dropdown, collapsible
  and live update is inert. Reloading does not help, because Phoenix remembers
  the long-poll downgrade in sessionStorage for the life of the tab.

  Pin a client to one replica for the socket path. This rides on its own
  Ingress rather than on the app's annotations so the affinity cookie is only
  set on `/live`, leaving public pages and assets cookie-free and cacheable.

  TLS and the certificate issuer stay on the main Ingress: ingress-nginx builds
  one server per host and merges the locations, and duplicating the TLS block
  here would point two cert-manager Certificates at the same Secret.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "glossia.fullname" . }}-live
  labels:
    {{- include "glossia.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: {{ .Values.ingress.liveSocket.cookieName | quote }}
    nginx.ingress.kubernetes.io/session-cookie-path: {{ .Values.ingress.liveSocket.path | quote }}
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
    {{- /* Move a client off a replica that stops answering rather than pinning
           it to a pod a rollout has already taken away. */}}
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
    {{- with .Values.ingress.liveSocket.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ $.Values.ingress.liveSocket.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "glossia.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
    {{- end }}
{{- end }}
