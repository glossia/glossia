[tools]
erlang = "latest"
elixir = "latest"
go = "1.22.0"
rust = "stable"
node = "22"
aws-cli = "2"
terraform = "1"
packer = "1"
hcloud = "latest"
kubectl = "latest"
kind = "latest"
helm = "3"
shellspec = "0.28.1"
infisical = "latest"
ruby = "3.4.7"
git-cliff = "2.10.0"
"github:superradcompany/microsandbox" = "0.6.6"

[env]
_.file = ".env"
_.source = "{{config_root}}/mise/utilities/dev_instance_env.sh"

[tasks."sandbox:image"]
description = "Build the local Glossia release image and load it into Microsandbox"
run = """
set -eu
image="glossia-local:${GLOSSIA_DEV_INSTANCE:-dev}"
docker build --build-context cli=./cli -f app/Dockerfile -t "$image" app
docker save "$image" | msb image load --tag "$image"
"""
