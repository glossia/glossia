[tools]
erlang = "latest"
elixir = "latest"
go = "1.22.0"
rust = "stable"
node = "22"
aws-cli = "2"
terraform = "1"
packer = "1"
hcloud = "latest"
kubectl = "latest"
kind = "latest"
helm = "3"
shellspec = "0.28.1"
infisical = "latest"
rclone = "1.74.4"
ruby = "3.4.7"
git-cliff = "2.10.0"
# microsandbox (`msb`) — used by the microsandbox Sandbox adapter for local
# sandbox isolation — is not distributed as a mise-installable binary (no GitHub
# release assets). Install it locally via its own installer when needed:
# https://github.com/microsandbox/microsandbox

[env]
_.file = ".env"
_.source = "{{config_root}}/mise/utilities/dev_instance_env.sh"
