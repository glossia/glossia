apiVersion: v1
kind: Service
metadata:
  name: {{ include "babel.headlessServiceName" . }}
  labels:
    {{- include "babel.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "babel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: epmd
      port: 4369
      targetPort: 4369
