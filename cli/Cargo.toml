[package]
name = "glossia"
version = "0.0.0"
edition = "2021"
default-run = "glossia"

[[bin]]
name = "glossia"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
globset = "0.4.18"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
walkdir = "2"
wait-timeout = "0.2"

[dev-dependencies]
pretty_assertions = "1"
