apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform
  namespace: org-glossia
spec:
  maxHistory: 5
  interval: 10m0s
  releaseName: platform
  targetNamespace: platform
  storageNamespace: platform
  kubeConfig:
    secretRef:
      name: glossia-production-kubeconfig
  chart:
    spec:
      chart: ./helm/platform
      interval: 5m0s
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: infra
        namespace: flux-system
      valuesFiles:
        - helm/platform/values.yaml
        - helm/platform/values-hetzner.yaml
        - helm/platform/values-object-storage-hetzner.yaml
        - helm/platform/values-remove-ceph.yaml
  install:
    createNamespace: true
    crds: Create
    strategy:
      name: RetryOnFailure
      retryInterval: 2m0s
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m0s
  timeout: 30m0s
