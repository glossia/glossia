# Turnstile widget for the public-account browse interstitial. Renders
# on GET /turnstile-challenge and is verified against Cloudflare's
# siteverify by GlossiaWeb.PublicPageChallengeController.
#
# Kept as a SEPARATE widget from the signup one so telemetry, secret
# rotation, and kill-switch flips scope to the surface they belong to.
# Same operator, same mechanics as `turnstile-signup-widget.yaml`: the
# cloudflare-operator materializes the sitekey (and, on first create
# only, the secret) into the Secret at spec.secretRef, and the app pod
# consumes that Secret via envFrom.
#
# The materialized site + secret keys are used by the app only when
# `publicPageChallenge.enabled: true` is set in the production values
# overlay, so this CR going active only provisions the widget-side
# infrastructure; user-facing enforcement is a separate app-chart flip.
apiVersion: cloudflare.glossia.ai/v1alpha1
kind: CloudflareTurnstileWidget
metadata:
  name: public-page
spec:
  # Substituted at apply time by the cloudflare-config Kustomization
  # from the cloudflare-ids Secret (populated by Infisical
  # /cloudflare-operator/ACCOUNT_ID).
  accountId: ${ACCOUNT_ID}
  name: "glossia.ai public-page challenge"
  domains:
    - glossia.ai
    - www.glossia.ai
  # `managed` shows the adaptive Cloudflare challenge (invisible in the
  # common case, JS/interactive when the heuristic sees a bot).
  mode: managed
  region: world
  clearanceLevel: interactive
  botFightMode: false
  offlabel: false
  crMode: active
  createNewWidget: true
  retainOnDelete: true
  secretRef:
    namespace: glossia
    name: turnstile-public-page
    siteKeyKey: TURNSTILE_SITE_KEY
    secretKeyKey: TURNSTILE_SECRET_KEY
