# Cloudflare zone + account id, pulled from Infisical so the CR
# YAMLs under cloudflare/ can stay generic. Consumed by the
# cloudflare-config Flux Kustomization via postBuild.substituteFrom,
# which expands ${ZONE_ID} and ${ACCOUNT_ID} in the CR YAMLs before
# apply.
#
# Lives on the management cluster in org-glossia (the namespace the
# cloudflare-config Kustomization is defined in). Requires ESO on the
# mgmt cluster (see k8s/mgmt/flux/external-secrets-helmrelease.yaml
# and k8s/mgmt/flux/infisical-secretstore.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-ids
  namespace: org-glossia
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cloudflare-ids
    creationPolicy: Owner
  data:
    - secretKey: ZONE_ID
      remoteRef:
        key: /cloudflare-operator/ZONE_ID
    - secretKey: ACCOUNT_ID
      remoteRef:
        key: /cloudflare-operator/ACCOUNT_ID
