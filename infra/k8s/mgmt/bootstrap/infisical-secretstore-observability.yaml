# Observability-cluster store. This uses a separate Infisical project and
# read-only machine identity so an observability-cluster credential cannot
# read production application secrets.

---
apiVersion: v1
kind: Namespace
metadata:
  name: infisical
  labels:
    app.kubernetes.io/managed-by: glossia-bootstrap
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://eu.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: infisical
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: infisical
            key: clientSecret
      secretsScope:
        projectSlug: glossia-observability
        environmentSlug: prod
