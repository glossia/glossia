# ClusterSecretStore wiring External Secrets Operator to the Glossia
# production Infisical project. Observability uses the sibling manifest with a
# separate project and read-only machine identity.
#
# Expects the `infisical-universal-auth` Secret in the `infisical` namespace
# with `clientId` and `clientSecret` keys. Keep those credentials out of Git.

---
apiVersion: v1
kind: Namespace
metadata:
  name: infisical
  labels:
    app.kubernetes.io/managed-by: glossia-bootstrap
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://eu.infisical.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: infisical
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: infisical
            key: clientSecret
      secretsScope:
        projectSlug: glossia
        environmentSlug: prod
