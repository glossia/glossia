  path: ./infra/k8s/clusters/workloads/observability
  prune: false
  deletionPolicy: Orphan
  serviceAccountName: workload-cluster-reconciler
  wait: true
  buildMetadata:
    - originAnnotations
  healthCheckExprs:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      inProgress: status.conditions.exists(condition, condition.type == 'Ready' && condition.status == 'Unknown')
      failed: status.conditions.exists(condition, condition.type == 'Ready' && condition.status == 'False')
      current: status.conditions.exists(condition, condition.type == 'Ready' && condition.status == 'True')
