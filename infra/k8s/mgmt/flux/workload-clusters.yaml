apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workload-cluster-production
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 45m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/k8s/clusters/workloads/production
  prune: false
  deletionPolicy: Orphan
  serviceAccountName: workload-cluster-reconciler
  wait: true
  buildMetadata:
    - originAnnotations
  healthCheckExprs:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      inProgress: status.conditions.exists(condition, condition.type == 'Ready' && condition.status == 'Unknown')
      failed: status.conditions.exists(condition, condition.type == 'Ready' && condition.status == 'False')
      current: status.conditions.exists(condition, condition.type == 'Ready' && condition.status == 'True')
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
