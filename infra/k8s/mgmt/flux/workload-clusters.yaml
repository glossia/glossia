apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workload-cluster-production
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 45m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/k8s/clusters/profiles/consolidation-production
  prune: false
  deletionPolicy: Orphan
  serviceAccountName: workload-cluster-reconciler
  healthChecks:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      name: glossia-production
      namespace: org-glossia
  buildMetadata:
    - originAnnotations
  healthCheckExprs:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      inProgress: status.conditions.filter(condition, condition.type == 'Available').all(condition, condition.status == 'Unknown')
      failed: status.conditions.filter(condition, condition.type == 'Available').all(condition, condition.status == 'False')
      current: status.conditions.filter(condition, condition.type == 'Available').all(condition, condition.status == 'True')
