# Applies the Infisical ClusterSecretStore separately from the ESO
# HelmRelease so the CRDs it depends on are in place before the
# ClusterSecretStore's dry-run happens. When they land in the same
# Kustomization pass the CS dry-run fails with "no matches for kind
# ClusterSecretStore" and aborts the whole batch, which also
# prevents the ESO HR itself from being applied.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-secretstore
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s/mgmt/external-secrets
  prune: true
  retryInterval: 2m0s
  # Wait for the ESO HelmRelease to be Ready before applying, so its
  # CRDs exist when the CS dry-run runs. Without this the first
  # reconcile would race the CRD registration.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: external-secrets
      namespace: flux-system
  sourceRef:
    kind: GitRepository
    name: infra
    namespace: flux-system
  timeout: 5m0s
  wait: true
