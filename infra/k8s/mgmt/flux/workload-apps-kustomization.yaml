apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workload-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: workload-platforms
  interval: 5m0s
  path: ./infra/k8s/workload-apps
  prune: true
  retryInterval: 2m0s
  serviceAccountName: workload-app-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
