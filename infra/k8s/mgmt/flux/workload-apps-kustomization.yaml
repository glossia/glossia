apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workload-apps
  namespace: flux-system
spec:
  dependsOn:
    - name: workload-platforms
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: glossia
      namespace: org-glossia
  interval: 5m0s
  path: ./infra/k8s/workload-apps
  prune: true
  retryInterval: 2m0s
  serviceAccountName: workload-app-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 30m0s
  wait: true
