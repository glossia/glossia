apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: workload-platforms
  namespace: flux-system
spec:
  dependsOn:
    - name: workload-cluster-production
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: platform
      namespace: org-glossia
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: observability
      namespace: org-glossia
  interval: 5m0s
  path: ./infra/k8s/workload-platforms
  prune: true
  retryInterval: 2m0s
  serviceAccountName: workload-platform-reconciler
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 45m0s
  wait: true
