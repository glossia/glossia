# External Secrets Operator on the management cluster.
#
# Workload clusters get ESO via the platform Helm chart's subchart
# (see helm/platform/Chart.yaml + values.yaml). The mgmt cluster
# needs it too so Flux Kustomizations here can pull secret values
# (zone IDs, account IDs, and other non-secret-but-not-public
# identifiers) from Infisical at build time via
# postBuild.substituteFrom.
#
# Chart version stays in step with the platform chart's ESO subchart
# (helm/platform/Chart.yaml → external-secrets 2.5.0) to avoid
# webhook + CRD version skew between the two ESO installs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 24h
  releaseName: external-secrets
  targetNamespace: external-secrets
  install:
    createNamespace: true
    crds: Create
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    # Left off so the CRD-dependent resources we ship next to this
    # HelmRelease (the Infisical ClusterSecretStore) are not swept up
    # when an upgrade momentarily fails.
    cleanupOnFail: false
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chart:
    spec:
      chart: external-secrets
      version: 2.5.0
      interval: 24h
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  values:
    installCRDs: true
    crds:
      # Keep serving the deprecated version so third-party controllers
      # that still register the v1beta1 webhook do not fail.
      unsafeServeV1Beta1: true
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 192Mi
    webhook:
      port: 9443
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
    certController:
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
