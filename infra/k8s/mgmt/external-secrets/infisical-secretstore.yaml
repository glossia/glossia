# ClusterSecretStore for the mgmt cluster's ESO. Authenticated via a
# scoped Infisical service token that only has READ access to
# /cloudflare-operator in the prod environment of the Glossia project.
# Narrower than the workload cluster's store (which uses a broadly
# scoped universal-auth machine identity because it consumes many
# folders) — mgmt does not need anything past /cloudflare-operator.
#
# EXPECTS a Secret `infisical-service-token` in the `infisical`
# namespace with a `token` key — kept out of git. Provision by:
#
#   1. Create a service token in the Glossia Infisical project via
#      `infisical service-token create --projectId <id> --scope
#      prod:/cloudflare-operator --access-level read --token-only`.
#   2. kubectl create secret generic infisical-service-token \
#        --namespace infisical --from-literal=token=<token>
#
# Applied by the external-secrets-secretstore Kustomization (which
# waits for the ESO HelmRelease to be Ready before applying).
---
apiVersion: v1
kind: Namespace
metadata:
  name: infisical
  labels:
    app.kubernetes.io/managed-by: glossia-bootstrap
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: https://eu.infisical.com
      auth:
        tokenAuthCredentials:
          accessToken:
            name: infisical-service-token
            namespace: infisical
            key: token
      secretsScope:
        projectSlug: glossia
        environmentSlug: prod
