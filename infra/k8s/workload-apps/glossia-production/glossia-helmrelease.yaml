apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: glossia
  namespace: org-glossia
spec:
  dependsOn:
    - name: platform
  maxHistory: 5
  interval: 10m0s
  releaseName: glossia
  targetNamespace: glossia
  storageNamespace: glossia
  kubeConfig:
    secretRef:
      name: glossia-production-kubeconfig
  chart:
    spec:
      # The Glossia Helm chart owns the FLAME managed runner + detached
      # translation-Job wiring. It lives in the same repository as the app
      # itself (glossia/glossia at deploy/helm/glossia).
      chart: ./deploy/helm/glossia
      interval: 5m0s
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      valuesFiles:
        - deploy/helm/glossia/values.yaml
        - deploy/helm/glossia/values-production.yaml
        - deploy/helm/glossia/values-object-storage-hetzner.yaml
  install:
    createNamespace: true
    crds: Create
    strategy:
      name: RetryOnFailure
      retryInterval: 2m0s
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m0s
  timeout: 20m0s
  values:
    image:
      repository: ghcr.io/glossia/glossia # {"$imagepolicy": "flux-system:glossia:name"}
      tag: main-enterprise # {"$imagepolicy": "flux-system:glossia:tag"}
      digest: sha256:16ce7a71226d9a9cb8728e6c0a8a228196ea2f2bd3fdec17ec62e8e8341d064f # {"$imagepolicy": "flux-system:glossia:digest"}
