# Final profile. Apply only after the consolidation profile, the object-storage
# migration, and the observability cutover have all been verified. It retains
# the three combined workers and removes both old worker pools. The existing
# control-plane server is deliberately left unchanged because the cluster's
# bootstrap endpoint currently points at that server's address.
- op: replace
  path: /spec/topology/workers/machineDeployments
  value:
    - class: hcloud-worker
      name: md-combined
      replicas: 3
      failureDomain: fsn1
      metadata:
        labels:
          node.cluster.x-k8s.io/pool: stateful
      variables:
        overrides:
          - name: hcloudWorkerMachineType
            value: cpx32
    # Editor live previews run repository code, so they get their own gVisor
    # nodes, tainted so nothing else lands on them. The cluster-autoscaler on
    # the management cluster owns `replicas` (hence none here) within these
    # bounds. One node stays warm because a cold node takes minutes to join,
    # longer than a preview waits for its pod. New nodes can join because
    # `control-plane-firewall-reconciler` allows their addresses.
    - class: hcloud-worker-gvisor
      name: md-preview
      failureDomain: fsn1
      metadata:
        labels:
          node.cluster.x-k8s.io/pool: editor-preview
        annotations:
          cluster.x-k8s.io/cluster-api-autoscaler-node-group-min-size: "1"
          cluster.x-k8s.io/cluster-api-autoscaler-node-group-max-size: "4"
      variables:
        overrides:
          - name: hcloudWorkerMachineType
            value: cpx32
          - name: workerNodeTaints
            value:
              - key: glossia.ai/editor-preview
                value: "true"
                effect: NoSchedule
    # Dedicated pool for the enterprise managed FLAME runner. Kept off
    # for now: the machineDeployment provisions HCloud servers that never
    # join the cluster (MachineHealthCheck cycles them every ~10 min).
    # Investigate the join failure before re-adding this block. In the
    # meantime the enterprise runner falls back to the `md-combined` pool
    # because `GLOSSIA_MANAGED_NODE_SELECTOR_JSON` is left
    # unset in values-production.yaml.
    # - class: hcloud-worker
    #   name: md-managed-runner
    #   replicas: 1
    #   failureDomain: fsn1
    #   metadata:
    #     labels:
    #       node.cluster.x-k8s.io/pool: managed-runner
    #   variables:
    #     overrides:
    #       - name: hcloudWorkerMachineType
    #         value: cpx32
