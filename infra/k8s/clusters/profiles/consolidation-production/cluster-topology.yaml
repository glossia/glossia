# Transition profile. It adds three CPX42 servers without changing or removing
# any existing worker. CX53 is the cheaper final type, but it is temporarily
# unavailable in Falkenstein. The shared `stateful` label lets stateful
# workloads move onto the new pool, while the absence of a taint also allows
# application pods. Return this transition pool to CX53 and verify its rolling
# replacement before applying the compact profile or removing an old worker.
- op: add
  path: /spec/topology/workers/machineDeployments/-
  value:
    class: hcloud-worker
    name: md-combined
    replicas: 3
    failureDomain: fsn1
    metadata:
      labels:
        node.cluster.x-k8s.io/pool: stateful
    variables:
      overrides:
        - name: hcloudWorkerMachineType
          value: cx53
