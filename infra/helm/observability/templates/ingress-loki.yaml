{{- if and .Values.ingress.enabled .Values.loki.enabled }}
# Loki push — served at .Values.ingress.loki.host. Workload-side log
# shippers (Alloy or the app's own Loki client gated by
# GLOSSIA_LOKI_URL in app/config/runtime.exs) push to /loki/api/v1/push
# here with basic auth.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki
  labels:
    {{- include "observability.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    {{- include "observability.pushAuthAnnotations" . | nindent 4 }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.loki.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                # nginx gateway shipped by loki chart (gateway.enabled).
                name: {{ .Release.Name }}-loki-gateway
                port:
                  number: 80
  tls:
    - secretName: loki-tls
      hosts:
        - {{ .Values.ingress.loki.host | quote }}
{{- end }}
