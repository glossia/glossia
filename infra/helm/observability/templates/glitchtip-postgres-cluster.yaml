{{- if and .Values.glitchtip.enabled .Values.glitchtipPostgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.glitchtipPostgres.clusterName }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: glitchtip-postgres
spec:
  instances: {{ .Values.glitchtipPostgres.instances }}

  bootstrap:
    initdb:
      database: {{ .Values.glitchtipPostgres.database | quote }}
      owner: {{ .Values.glitchtipPostgres.user | quote }}
      secret:
        name: {{ .Values.glitchtipPostgres.appSecretName }}

  storage:
    storageClass: {{ .Values.glitchtipPostgres.storage.storageClass | quote }}
    size: {{ .Values.glitchtipPostgres.storage.size | quote }}

  resources:
    {{- toYaml .Values.glitchtipPostgres.resources | nindent 4 }}

  affinity:
    enablePodAntiAffinity: {{ .Values.glitchtipPostgres.enablePodAntiAffinity }}
    topologyKey: {{ .Values.glitchtipPostgres.topologyKey | quote }}
    {{- with .Values.glitchtipPostgres.nodeSelector }}
    nodeSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.glitchtipPostgres.tolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
