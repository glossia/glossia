apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "discourse.name" . }}
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    # The shared uploads volume can attach to only one node at a time.
    type: Recreate
  selector:
    matchLabels:
      {{- include "discourse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "discourse.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: configure-proxy-headers
          image: {{ include "discourse.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -ec
          args:
            - |-
              cp /etc/nginx/conf.d/discourse.conf /work/discourse.conf
              sed -i \
                -e 's/proxy_set_header X-Forwarded-For $remote_addr;/proxy_set_header X-Forwarded-For $http_x_forwarded_for;/g' \
                -e 's/proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;/proxy_set_header X-Forwarded-For $http_x_forwarded_for;/g' \
                /work/discourse.conf
              grep -q 'proxy_set_header X-Forwarded-For $http_x_forwarded_for;' /work/discourse.conf
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nginx-config
              mountPath: /work
      containers:
        - name: discourse
          image: {{ include "discourse.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - NET_BIND_SERVICE
                - SETGID
                - SETUID
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: DISCOURSE_HOSTNAME
              value: {{ required "host is required" .Values.host | quote }}
            - name: DISCOURSE_DEVELOPER_EMAILS
              value: {{ required "developerEmails is required" .Values.developerEmails | quote }}
            - name: DISCOURSE_NOTIFICATION_EMAIL
              value: {{ required "notificationEmail is required" .Values.notificationEmail | quote }}
            - name: DISCOURSE_FORCE_HTTPS
              value: "true"
            - name: DISCOURSE_DB_SOCKET
              value: ""
            - name: DISCOURSE_DB_HOST
              value: {{ printf "%s-rw.%s.svc.cluster.local" .Values.postgres.clusterName .Release.Namespace | quote }}
            - name: DISCOURSE_DB_PORT
              value: "5432"
            - name: DISCOURSE_DB_NAME
              value: {{ .Values.postgres.database | quote }}
            - name: DISCOURSE_DB_USERNAME
              value: {{ .Values.postgres.user | quote }}
            - name: DISCOURSE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.appSecretName }}
                  key: password
            - name: DISCOURSE_REDIS_HOST
              value: {{ include "discourse.name" . }}-redis
            - name: DISCOURSE_REDIS_PORT
              value: "6379"
            - name: DISCOURSE_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.passwordSecretName }}
                  key: {{ .Values.redis.passwordSecretKey }}
            - name: DISCOURSE_SMTP_ADDRESS
              value: {{ .Values.mailRelay.host | quote }}
            - name: DISCOURSE_SMTP_PORT
              value: {{ .Values.mailRelay.port | quote }}
            - name: DISCOURSE_SMTP_ENABLE_START_TLS
              value: {{ .Values.mailRelay.startTls | quote }}
            - name: DISCOURSE_SMTP_AUTHENTICATION
              value: {{ .Values.mailRelay.authentication | quote }}
            - name: DISCOURSE_SMTP_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.appSecretName }}
                  key: {{ .Values.mailRelay.usernameSecretKey }}
            - name: DISCOURSE_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.appSecretName }}
                  key: {{ .Values.mailRelay.passwordSecretKey }}
            - name: CREATE_DB_ON_BOOT
              value: "0"
            - name: DISABLE_LETSENCRYPT
              value: "1"
            - name: MIGRATE_ON_BOOT
              value: "1"
            - name: PRECOMPILE_ON_BOOT
              value: "1"
            - name: UNICORN_WORKERS
              value: {{ .Values.web.workers | quote }}
            - name: UNICORN_SIDEKIQS
              value: {{ .Values.web.sidekiqWorkers | quote }}
          startupProbe:
            httpGet:
              path: /srv/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /srv/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /srv/status
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/discourse.conf
              subPath: discourse.conf
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: {{ include "discourse.name" . }}-shared
        - name: nginx-config
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "discourse.name" . }}
  labels:
    {{- include "discourse.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "discourse.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
