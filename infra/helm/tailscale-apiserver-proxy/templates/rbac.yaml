apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tailscale-apiserver-proxy.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailscale-apiserver-proxy.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tailscale-apiserver-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailscale-apiserver-proxy.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - {{ .Values.proxy.stateSecretName }}
    verbs:
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tailscale-apiserver-proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailscale-apiserver-proxy.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tailscale-apiserver-proxy.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tailscale-apiserver-proxy.fullname" . }}
