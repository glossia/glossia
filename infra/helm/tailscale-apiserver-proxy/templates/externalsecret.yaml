{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tailscale-apiserver-proxy.fullname" . }}-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tailscale-apiserver-proxy.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeRef.name }}
    kind: {{ .Values.externalSecrets.storeRef.kind }}
  target:
    name: {{ .Values.proxy.authSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        {{ .Values.proxy.authSecretKey }}: "{{ `{{ .AUTHKEY | trim }}` }}"
  data:
    - secretKey: AUTHKEY
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.item .Values.externalSecrets.field | quote }}
{{- end }}
