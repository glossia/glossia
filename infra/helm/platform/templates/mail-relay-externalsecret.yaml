{{- if and .Values.mailRelay.enabled .Values.mailRelay.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.mailRelay.externalSecret.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mail-relay
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.mailRelay.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.mailRelay.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.mailRelay.externalSecret.secretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        RELAYHOST: {{ printf "[{{ .%s }}]:{{ .%s }}" .Values.mailRelay.externalSecret.fields.host .Values.mailRelay.externalSecret.fields.port | quote }}
        RELAYHOST_USERNAME: {{ printf "{{ .%s }}" .Values.mailRelay.externalSecret.fields.username | quote }}
        RELAYHOST_PASSWORD: {{ printf "{{ .%s }}" .Values.mailRelay.externalSecret.fields.password | quote }}
        {{- if .Values.mailRelay.clientAuth.enabled }}
        SMTPD_SASL_USERS: {{ printf "{{ .%s }}:{{ .%s }}" (required "mailRelay.externalSecret.fields.clientUsername is required when mailRelay.clientAuth.enabled=true" .Values.mailRelay.externalSecret.fields.clientUsername) (required "mailRelay.externalSecret.fields.clientPassword is required when mailRelay.clientAuth.enabled=true" .Values.mailRelay.externalSecret.fields.clientPassword) | quote }}
        {{- end }}
  dataFrom:
    - extract:
        key: {{ .Values.mailRelay.externalSecret.itemKey | quote }}
{{- end }}
