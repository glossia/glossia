{{- if .Values.externalObjectStorage.releaseProxy.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalObjectStorage.releaseProxy.credentials.secretName }}
  namespace: {{ .Values.externalObjectStorage.releaseProxy.namespace }}
  labels:
    app.kubernetes.io/name: glossia-platform
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.externalObjectStorage.releaseProxy.credentials.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalObjectStorage.releaseProxy.credentials.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.externalObjectStorage.releaseProxy.credentials.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalObjectStorage.releaseProxy.credentials.itemKey .Values.externalObjectStorage.releaseProxy.credentials.accessKeyIdField | quote }}
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalObjectStorage.releaseProxy.credentials.itemKey .Values.externalObjectStorage.releaseProxy.credentials.secretAccessKeyField | quote }}
{{- end }}
