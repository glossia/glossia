{{- if and .Values.mailRelay.enabled .Values.mailRelay.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.mailRelay.fullnameOverride }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: mail-relay
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  accessModes:
    {{- toYaml .Values.mailRelay.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.mailRelay.persistence.size | quote }}
  {{- if .Values.mailRelay.persistence.storageClassName }}
  storageClassName: {{ .Values.mailRelay.persistence.storageClassName | quote }}
  {{- end }}
{{- end }}
