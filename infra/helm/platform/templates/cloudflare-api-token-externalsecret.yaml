{{- if and (index .Values "external-dns" "enabled") .Values.cloudflare.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.cloudflare.apiTokenSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cloudflare-api-token
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ .Values.cloudflare.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.cloudflare.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.cloudflare.apiTokenSecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.cloudflare.apiTokenSecret.key }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.cloudflare.externalSecret.itemKey .Values.cloudflare.externalSecret.credentialField | quote }}
{{- end }}
