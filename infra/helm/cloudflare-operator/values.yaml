# Deployment for the cloudflare-operator controller manager. All fields
# below have sensible defaults; overrides live in the environment-
# specific values files.

image:
  repository: ghcr.io/glossia/cloudflare-operator
  # The image workflow publishes :sha-<git-sha> and :latest tags per
  # push to main. The chart's appVersion is not published as an image
  # tag today, so falling back to it would land in ErrImagePull.
  # Override to :sha-<git-sha> at install time for reproducible deploys.
  tag: latest
  # Set together with tag in managed environments. Kubernetes verifies
  # this content digest before starting the container, so a mutable tag
  # cannot move the deployed operator to an unreviewed build.
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# Resync interval passed to the manager. The reconciler requeues each
# CR after this delay following a successful pass, which is also the
# window inside which dashboard drift gets corrected back to git.
resyncInterval: 5m

# Namespace the operator runs in. The chart itself is namespaced but
# the CRDs it installs are cluster-scoped.
namespace: cloudflare-operator

# ExternalSecret pulling the Cloudflare API token from Infisical. The
# API_TOKEN field lives in the same /cloudflare-operator item as
# ZONE_ID and ACCOUNT_ID (consumed by the cloudflare-config
# Kustomization via postBuild.substituteFrom on the mgmt cluster). The
# token itself must be scoped with:
#   - Zone:Read
#   - Zone WAF:Edit (rate limits and custom firewall rules)
#   - Account Turnstile:Edit (widget CRUD)
# This is a DIFFERENT token from the DNS-scoped one used by external-dns
# and cert-manager; do not reuse that credential.
externalSecret:
  enabled: true
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  refreshInterval: 1h
  itemKey: /cloudflare-operator
  credentialField: API_TOKEN

# Deployment plumbing.
serviceAccount:
  name: cloudflare-operator

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# ExternalSecret + imagePullSecrets wiring for pulling the private
# ghcr.io/glossia/cloudflare-operator image. Reuses the ghcr pull
# credentials already stored in Infisical /kubernetes (same folder the
# existing workload-cluster ExternalSecrets pull from), so operators
# don't have to keep two copies of the same PAT in sync. Kept as a
# first-class chart value rather than a copy-secret Kustomization so a
# fresh install has everything it needs from the chart alone.
imagePullSecret:
  enabled: true
  name: ghcr-pull-secret
  registry: ghcr.io
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  refreshInterval: 1h
  itemKey: /kubernetes
  usernameField: GHCR_PULL_USERNAME
  passwordField: GHCR_PULL_TOKEN

# Whether to install the CRDs. When Flux takes ownership of applying
# CRDs directly, this can be turned off to avoid double-management.
installCRDs: true

# Name of the Kubernetes Secret the pod mounts for the Cloudflare
# API token (expected to expose a `token` key). When
# externalSecret.enabled is true (default) the chart renders the
# ExternalSecret and the target is `cloudflare-operator-token`;
# override this only if you provision the Secret out-of-band and set
# externalSecret.enabled=false.
tokenSecretName: ""
