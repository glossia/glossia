{{- if .Values.imagePullSecret.enabled -}}
# ExternalSecret rendering a kubernetes.io/dockerconfigjson Secret so
# the operator pod can pull its private ghcr.io image. Follows the
# same shape the main glossia chart uses (see
# glossia/glossia:deploy/helm/glossia/templates/external-secrets/image-pull-secret.yaml),
# just scoped to the operator's own namespace and reading from the
# shared /glossia Infisical item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.imagePullSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.imagePullSecret.secretStoreRef.name }}
    kind: {{ .Values.imagePullSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.imagePullSecret.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"{{ .%s }}","password":"{{ .%s }}","auth":"{{ printf "%%s:%%s" .%s .%s | b64enc }}"}}}` .Values.imagePullSecret.registry .Values.imagePullSecret.usernameField .Values.imagePullSecret.passwordField .Values.imagePullSecret.usernameField .Values.imagePullSecret.passwordField | quote }}
  data:
    - secretKey: {{ .Values.imagePullSecret.usernameField }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.imagePullSecret.itemKey .Values.imagePullSecret.usernameField | quote }}
    - secretKey: {{ .Values.imagePullSecret.passwordField }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.imagePullSecret.itemKey .Values.imagePullSecret.passwordField | quote }}
{{- end }}
