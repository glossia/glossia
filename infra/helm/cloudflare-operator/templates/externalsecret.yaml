{{- if .Values.externalSecret.enabled -}}
# ExternalSecret projecting the Cloudflare API token from Infisical into
# a Kubernetes Secret the operator pod mounts at /etc/cloudflare/token.
# Uses the shared `infisical` ClusterSecretStore installed by the
# platform chart (see ops/infra/k8s/mgmt/bootstrap/infisical-secretstore.yaml).
# The remoteRef key is a "<path>/<field>" pair so the shape matches the
# platform chart's existing cloudflare-api-token ExternalSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-operator-token
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: cloudflare-operator-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecret.itemKey .Values.externalSecret.credentialField | quote }}
{{- end }}
