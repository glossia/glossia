# Tailscale operator wrapper for Glossia workload clusters.
#
# Install one release per workload cluster:
#   helm upgrade --install tailscale-operator infra/helm/tailscale-operator \
#     --namespace tailscale \
#     --create-namespace \
#     --values infra/helm/tailscale-operator/values-production.yaml

externalSecrets:
  enabled: true
  refreshInterval: "1h"
  storeRef:
    kind: ClusterSecretStore
    name: onepassword
  item: tailscale-operator
  fields:
    clientID: client-id
    clientSecret: client-secret
  secretName: operator-oauth

tailscale-operator:
  # The operator chart consumes this pre-created Secret when oauth.clientId
  # and oauth.clientSecret are empty. It must contain client_id and
  # client_secret keys.
  oauth:
    clientId: ""
    clientSecret: ""
  operatorConfig:
    hostname: glossia-k8s
    defaultTags:
      - "tag:glossia-k8s"
    nodeSelector:
      kubernetes.io/os: linux
  proxyConfig:
    defaultTags: "tag:glossia-k8s"
  apiServerProxyConfig:
    allowImpersonation: "false"
    mode: "false"

apiServerProxy:
  enabled: true
  name: glossia-kube-apiserver
  hostname: glossia-kube-apiserver
  replicas: 2
  mode: noauth
  tags:
    - "tag:glossia-k8s"
  proxyClass:
    enabled: true
    name: glossia-kube-apiserver
    nodeSelector:
      kubernetes.io/os: linux
    tolerations: []
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
