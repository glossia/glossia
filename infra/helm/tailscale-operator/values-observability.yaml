# Observability workload cluster overlay. Every node in this cluster is
# tainted as stateful, so both the operator and the proxy need the same
# toleration used by the platform and observability releases.

statefulTolerations: &statefulTolerations
  - key: node.cluster.x-k8s.io/pool
    operator: Equal
    value: stateful
    effect: NoSchedule

tailscale-operator:
  operatorConfig:
    hostname: glossia-k8s-observability
    defaultTags:
      - "tag:glossia-k8s-observability"
    tolerations: *statefulTolerations
  proxyConfig:
    defaultTags: "tag:glossia-k8s-observability"

apiServerProxy:
  name: glossia-observability-kube
  hostname: glossia-observability-kube
  tags:
    - "tag:glossia-k8s-observability"
  proxyClass:
    name: glossia-observability-kube
    tolerations: *statefulTolerations
