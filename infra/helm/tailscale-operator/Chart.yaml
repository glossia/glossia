apiVersion: v2
name: glossia-tailscale-operator
description: >
  Wraps the Tailscale Kubernetes operator chart and adds an
  ExternalSecret-backed Kubernetes control-plane proxy so operators and automation can
  reach each workload cluster through the tailnet.
type: application
version: 0.1.0
appVersion: "1.96.5"

dependencies:
  - name: tailscale-operator
    version: 1.96.5
    repository: https://pkgs.tailscale.com/helmcharts
