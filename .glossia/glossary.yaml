# Repository glossary. Merged into the platform glossary at translation time
# via `Glossia.Translations.RepoGlossary`; repo entries win per (source term,
# target locale) so a checkout carries the developer-authoritative names.
#
# Format:
#   - id (optional, defaults to slugified source): stable identifier that
#     survives edits and shows up in each lockfile's glossary provenance.
#   - source (required): term as it appears in translatable text.
#   - case_sensitive (optional, default false): matching mode.
#   - definition (optional): guidance surfaced to the model.
#   - targets (map of locale -> translation): omit a locale to defer to the
#     platform glossary for that language; empty translations are rejected.
entries:
  - id: lockfile
    source: lockfile
    definition: The per-source/per-locale file under .glossia/ that records
      what was translated and against which context.
    targets:
      es: archivo de bloqueo
      fr: fichier de verrouillage
      de: Lock-Datei
      ja: ロックファイル
      zh-Hans: 锁文件
      ko: 잠금 파일
      pt-BR: arquivo de bloqueio
